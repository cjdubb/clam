<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>clam-code · doc view</title>
<link rel="icon" href="data:," />
<style>
  /* Dark theme adapted from the clam-code release-notes design language.
     System fonts only — this file must render with zero network access. */
  :root {
    --bg: #050810;
    --bg-2: #0a1424;
    --card: rgba(255, 255, 255, 0.035);
    --card-hover: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.09);
    --border-glow: rgba(45, 212, 191, 0.35);
    --text: #eaf1fb;
    --muted: #93a1ba;
    --muted-2: #6b788e;
    --teal: #2dd4bf;
    --teal-soft: #6ee7d8;
    --gold: #f6c177;
    --coral: #ff8a6b;
    --green: #4ade80;
    --violet: #a78bfa;
    --display: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px clamp(16px, 4vw, 40px);
    background: rgba(5, 8, 16, 0.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    font-family: var(--display); font-weight: 700;
    letter-spacing: -0.01em; font-size: 16px; white-space: nowrap;
  }
  .brand .shell { font-size: 20px; filter: drop-shadow(0 2px 8px rgba(45,212,191,0.4)); }
  .brand .dim { color: var(--muted-2); font-weight: 500; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

  .pill {
    font-size: 12px; font-weight: 600;
    padding: 4px 12px; border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--teal-soft);
    background: rgba(45, 212, 191, 0.08);
    letter-spacing: 0.02em; white-space: nowrap;
  }
  .pill.generic { color: var(--muted); background: rgba(255,255,255,0.04); }

  .btn {
    font-family: var(--body); font-size: 12.5px; font-weight: 600;
    color: var(--muted); background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 13px; cursor: pointer; white-space: nowrap;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .btn:hover:not(:disabled) {
    color: var(--teal-soft);
    border-color: var(--border-glow);
    background: rgba(45, 212, 191, 0.1);
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.active { color: var(--teal-soft); border-color: var(--border-glow); background: rgba(45, 212, 191, 0.12); }
  .btn.attention { color: var(--gold); border-color: rgba(246, 193, 119, 0.4); }
  .btn.error { color: var(--coral); border-color: rgba(255, 138, 107, 0.4); background: rgba(255, 138, 107, 0.12); }
  .nav-link { text-decoration: none; display: inline-flex; align-items: center; }

  /* ---------- Layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: 250px minmax(0, 1fr);
    gap: clamp(20px, 3vw, 44px);
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(18px, 3vw, 36px) clamp(16px, 4vw, 40px) 90px;
  }
  /* While the graph view is active the #toc nav is display:none, and grid
     auto-placement would drop #main into the 250px TOC column — squeezing
     the cytoscape canvas into a strip at the left edge. Collapse to a
     single full-width column for the graph's lifetime instead. */
  .layout.graph-active { grid-template-columns: minmax(0, 1fr); }

  /* ---------- TOC ---------- */
  .toc {
    position: sticky;
    top: 76px;
    align-self: start;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    padding-right: 6px;
    font-size: 13px;
  }
  .toc .toc-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--muted-2); margin: 6px 0 10px 12px;
  }
  .toc ul { list-style: none; }
  .toc a {
    display: block;
    color: var(--muted);
    text-decoration: none;
    padding: 5px 12px;
    border-left: 2px solid transparent;
    border-radius: 0 8px 8px 0;
    line-height: 1.35;
    transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .toc a:hover { color: var(--text); background: var(--card); }
  .toc a.active { color: var(--teal-soft); border-left-color: var(--teal); background: rgba(45, 212, 191, 0.06); }
  .toc li.lvl-3 a { padding-left: 26px; font-size: 12px; color: var(--muted-2); }
  .toc li.lvl-3 a:hover { color: var(--muted); }
  .toc li.lvl-3 a.active { color: var(--teal-soft); }
  .toc-controls { display: flex; gap: 6px; margin: 14px 0 0 12px; }
  .toc-controls .btn { font-size: 11px; padding: 3px 10px; }

  /* ---------- Hero (H1 + doc meta) ---------- */
  .hero { margin: 4px 0 30px; position: relative; }
  .hero h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(26px, 4.4vw, 42px);
    line-height: 1.08;
    letter-spacing: -0.025em;
    background: linear-gradient(180deg, #ffffff 30%, #b9cbe6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    padding-right: 44px;
  }
  .meta-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .meta-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 4px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
  }
  .meta-pill .k { color: var(--muted-2); font-weight: 600; text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.08em; }
  .meta-pill .v { color: var(--text); font-weight: 500; }
  .meta-pill.status-open .v { color: var(--gold); }
  .meta-pill.status-resolved .v { color: var(--green); }
  .hero .preamble { margin-top: 16px; color: var(--muted); }
  .hero .preamble p { margin-top: 8px; }
  .rendered-at { margin-top: 14px; font-size: 11.5px; color: var(--muted-2); font-family: var(--mono); }

  /* ---------- Sections ---------- */
  .doc-sec {
    margin-bottom: 18px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--card);
    transition: border-color 0.25s ease;
    scroll-margin-top: 84px;
  }
  .doc-sec:hover { border-color: rgba(255, 255, 255, 0.16); }
  .sec-head {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px;
    cursor: pointer;
    user-select: none;
  }
  .sec-head h2 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(17px, 2.4vw, 21px);
    letter-spacing: -0.015em;
    line-height: 1.2;
    flex: 1;
  }
  .caret {
    flex: none; width: 22px; height: 22px;
    display: grid; place-items: center;
    color: var(--muted-2); font-size: 11px;
    transition: transform 0.25s ease;
  }
  .doc-sec.collapsed .caret { transform: rotate(-90deg); }
  .doc-sec.collapsed .sec-body { display: none; }
  .sec-body { padding: 2px 22px 20px; }

  .annotate-btn {
    flex: none;
    font-size: 11.5px; font-weight: 600;
    color: var(--muted-2);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 3px 10px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .sec-head:hover .annotate-btn, .hero:hover .annotate-btn { opacity: 1; }
  .annotate-btn:hover { color: var(--teal-soft); border-color: var(--border-glow); background: rgba(45, 212, 191, 0.08); }
  .hero .annotate-btn { position: absolute; top: 6px; right: 0; }

  /* ---------- Block-level annotate (gutter button) ---------- */
  .block-annotate {
    position: absolute;
    z-index: 40;
    width: 22px; height: 22px;
    display: none;
    place-items: center;
    font-size: 14px; font-weight: 700; line-height: 1;
    color: var(--muted-2);
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    padding: 0;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .block-annotate.show { display: grid; }
  .block-annotate:hover { color: var(--teal-soft); border-color: var(--border-glow); }
  .annotating { outline: 1px dashed var(--border-glow); outline-offset: 4px; border-radius: 4px; }
  .composer.floating { position: absolute; z-index: 45; width: min(540px, calc(100vw - 40px)); margin: 0; }

  /* ---------- Markdown content ---------- */
  .sec-body h3, .sec-body h4 {
    font-family: var(--display);
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 22px 0 10px;
    scroll-margin-top: 84px;
  }
  .sec-body h3 { font-size: 16.5px; }
  .sec-body h4 { font-size: 14.5px; color: var(--muted); }
  .sec-body p { margin: 10px 0; color: var(--text); font-size: 14.5px; }
  .sec-body p, .sec-body li { overflow-wrap: break-word; }
  .sec-body ul, .sec-body ol { margin: 10px 0 10px 22px; font-size: 14.5px; }
  .sec-body li { margin: 5px 0; }
  .sec-body li::marker { color: var(--muted-2); }
  .sec-body ul ul, .sec-body ol ol, .sec-body ul ol, .sec-body ol ul { margin-top: 5px; margin-bottom: 0; }
  .sec-body a { color: var(--teal-soft); text-decoration: none; border-bottom: 1px solid rgba(110, 231, 216, 0.3); }
  .sec-body a:hover { border-bottom-color: var(--teal-soft); }
  .sec-body strong { color: var(--text); font-weight: 650; }
  .sec-body em { color: var(--muted); }
  .sec-body blockquote {
    margin: 12px 0; padding: 8px 18px;
    border-left: 3px solid var(--teal);
    background: rgba(45, 212, 191, 0.05);
    border-radius: 0 10px 10px 0;
    color: var(--muted);
  }
  .sec-body hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .sec-body input[type="checkbox"] { accent-color: var(--teal); margin-right: 6px; }

  .sec-body code {
    font-family: var(--mono);
    font-size: 0.86em;
    padding: 2px 6px;
    border-radius: 6px;
    background: rgba(45, 212, 191, 0.1);
    color: var(--teal-soft);
    border: 1px solid rgba(45, 212, 191, 0.18);
  }
  .sec-body pre {
    margin: 14px 0;
    padding: 14px 16px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow-x: auto;
    line-height: 1.5;
  }
  .sec-body pre code {
    background: none; border: none; padding: 0;
    color: #c9d7ee; font-size: 12.5px;
  }

  .sec-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0;
    font-size: 13.5px;
    display: block;
    overflow-x: auto;
  }
  .sec-body th, .sec-body td {
    text-align: left;
    padding: 8px 14px;
    border: 1px solid var(--border);
    vertical-align: top;
  }
  .sec-body th {
    font-family: var(--display);
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--teal-soft);
    background: rgba(45, 212, 191, 0.06);
    white-space: nowrap;
  }
  .sec-body tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }

  /* ---------- @TAG highlighting ---------- */
  .tag-mark {
    font-family: var(--mono);
    font-size: 0.85em;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 6px;
    letter-spacing: 0.02em;
  }
  .tag-comment  { color: var(--teal-soft); background: rgba(45, 212, 191, 0.12);  border: 1px solid rgba(45, 212, 191, 0.3); }
  .tag-question { color: var(--gold);      background: rgba(246, 193, 119, 0.12); border: 1px solid rgba(246, 193, 119, 0.3); }
  .tag-concern  { color: var(--coral);     background: rgba(255, 138, 107, 0.12); border: 1px solid rgba(255, 138, 107, 0.3); }
  .tag-approve  { color: var(--green);     background: rgba(74, 222, 128, 0.12);  border: 1px solid rgba(74, 222, 128, 0.3); }
  .tag-evidence { color: var(--violet);    background: rgba(167, 139, 250, 0.12); border: 1px solid rgba(167, 139, 250, 0.3); }

  /* ---------- Schema: option / approach cards ---------- */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 14px;
    margin: 14px 0;
  }
  .opt-card {
    border: 1px solid var(--border);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.025);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
  }
  .opt-card:hover { transform: translateY(-3px); border-color: var(--border-glow); background: var(--card-hover); }
  .opt-card > h3 { margin: 0 0 10px; font-size: 15.5px; }
  .opt-card .opt-num {
    display: inline-grid; place-items: center;
    width: 22px; height: 22px; margin-right: 8px;
    border-radius: 7px; font-size: 12px; font-weight: 800;
    color: var(--teal-soft);
    background: rgba(45, 212, 191, 0.12);
    border: 1px solid rgba(45, 212, 191, 0.25);
  }
  .opt-card.recommended { border-color: rgba(45, 212, 191, 0.45); box-shadow: 0 0 24px rgba(45, 212, 191, 0.08) inset; }
  .opt-card .rec-flag {
    align-self: flex-start;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--teal-soft); margin-bottom: 8px;
    padding: 2px 9px; border-radius: 999px;
    background: rgba(45, 212, 191, 0.12); border: 1px solid rgba(45, 212, 191, 0.3);
  }
  .pros-cons { margin-top: auto; padding-top: 6px; }
  .pros-cons p { margin: 8px 0; font-size: 13.5px; }
  .pros-cons .pros-lbl, .pros-cons .cons-lbl {
    display: block;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 2px;
  }
  .pros-cons .pros-lbl { color: var(--green); }
  .pros-cons .cons-lbl { color: var(--coral); }
  .why-not { position: relative; padding-left: 24px; color: var(--muted); }
  .why-not::before { content: "\2715"; position: absolute; left: 0; top: 2px; color: var(--coral); font-weight: 700; font-size: 12px; }
  .desc-line { position: relative; padding-left: 24px; }
  .desc-line::before { content: "\203A"; position: absolute; left: 4px; top: 0; color: var(--muted-2); font-weight: 700; }

  /* ---------- Schema: recommendation banner ---------- */
  .doc-sec.rec-banner {
    border-color: rgba(45, 212, 191, 0.4);
    background: linear-gradient(160deg, rgba(45, 212, 191, 0.08), rgba(45, 212, 191, 0.02));
    box-shadow: 0 0 40px rgba(45, 212, 191, 0.06);
  }
  .doc-sec.rec-banner .sec-head h2 { color: var(--teal-soft); }
  .doc-sec.rec-banner .sec-head h2::before { content: "\2605\00a0"; font-size: 0.85em; }

  /* ---------- Schema: per-question recommendation banner (design-questions) ---------- */
  .sec-body p.dq-rec {
    margin: 16px 0 6px;
    padding: 12px 16px 12px 18px;
    border: 1px solid rgba(45, 212, 191, 0.4);
    border-left: 3px solid var(--teal);
    border-radius: 12px;
    background: linear-gradient(160deg, rgba(45, 212, 191, 0.08), rgba(45, 212, 191, 0.02));
    color: var(--text);
    font-size: 14px;
  }
  .dq-rec .dq-rec-lbl {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--teal-soft);
    margin-right: 8px;
    white-space: nowrap;
  }
  .dq-rec .dq-rec-lbl::before { content: "\2605"; font-size: 1.05em; }

  /* ---------- Schema: edge-case list ---------- */
  .edge-list { list-style: none; margin: 12px 0 !important; }
  .edge-list > li {
    margin: 8px 0;
    padding: 10px 14px 10px 16px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--muted-2);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.02);
  }
  .edge-list > li.critical { border-left-color: var(--coral); background: rgba(255, 138, 107, 0.05); }
  .edge-list .crit-badge {
    font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--coral);
    padding: 1px 8px; margin-right: 8px;
    border-radius: 999px; border: 1px solid rgba(255, 138, 107, 0.4);
    background: rgba(255, 138, 107, 0.1);
  }
  .edge-arrow { color: var(--teal); font-weight: 700; padding: 0 2px; }

  /* ---------- Schema: changelog timeline ---------- */
  .timeline { margin: 14px 0 4px; padding-left: 4px; }
  .tl-entry {
    position: relative;
    padding: 0 0 16px 26px;
    border-left: 2px solid var(--border);
    margin-left: 8px;
  }
  .tl-entry:last-child { padding-bottom: 2px; }
  .tl-entry::before {
    content: "";
    position: absolute; left: -6px; top: 5px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 10px rgba(45, 212, 191, 0.6);
  }
  .tl-date { font-family: var(--mono); font-size: 11.5px; color: var(--muted-2); }
  .tl-change { font-size: 14px; color: var(--text); margin-top: 1px; }
  .tl-reason { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 1px; }

  /* ---------- Schema: work-graph tree ---------- */
  .wg-tree { display: flex; flex-direction: column; gap: 0; }
  .wg-node { margin-bottom: 4px; }
  .wg-children {
    margin: 10px 0 4px 22px;
    padding-left: 16px;
    border-left: 2px dashed var(--border);
    display: flex; flex-direction: column; gap: 4px;
  }
  .wg-summary { padding: 2px 0; }
  .wg-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 10px; }
  .wg-status-pill {
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--muted); background: rgba(255, 255, 255, 0.04);
  }
  .wg-status-pill.wg-status-open { color: var(--gold); border-color: rgba(246, 193, 119, 0.4); background: rgba(246, 193, 119, 0.1); }
  .wg-status-pill.wg-status-in-progress { color: #8ab4f8; border-color: rgba(138, 180, 248, 0.4); background: rgba(138, 180, 248, 0.1); }
  .wg-status-pill.wg-status-done { color: var(--green); border-color: rgba(74, 222, 128, 0.4); background: rgba(74, 222, 128, 0.1); }
  .wg-status-pill.wg-status-dropped { color: var(--coral); border-color: rgba(255, 138, 107, 0.4); background: rgba(255, 138, 107, 0.1); }
  .wg-dep-badge {
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    padding: 2px 9px; border-radius: 999px;
    color: var(--muted); background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border);
  }
  .wg-goal { font-size: 14.5px; color: var(--text); }
  .wg-notes { font-size: 13px; color: var(--muted); font-style: italic; }
  .wg-focus-banner {
    margin: 0 0 18px; padding: 10px 16px;
    border: 1px solid rgba(45, 212, 191, 0.4); border-left: 3px solid var(--teal);
    border-radius: 12px;
    background: linear-gradient(160deg, rgba(45, 212, 191, 0.08), rgba(45, 212, 191, 0.02));
    color: var(--teal-soft); font-size: 13.5px; font-weight: 600;
  }
  .wg-focused { border-color: rgba(45, 212, 191, 0.55); box-shadow: 0 0 24px rgba(45, 212, 191, 0.1); }

  /* ---------- Schema: work-graph graph view ---------- */
  .graph-view {
    min-height: 72vh;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--card);
  }
  @keyframes wg-jump-flash {
    0% { box-shadow: 0 0 0 3px var(--border-glow); }
    100% { box-shadow: none; }
  }
  .wg-jump-highlight { animation: wg-jump-flash 1.4s ease-out; }

  /* ---------- Feedback composer popover ---------- */
  .composer {
    margin: 0 20px 16px;
    padding: 14px 16px;
    border: 1px solid var(--border-glow);
    border-radius: 14px;
    background: var(--bg-2);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  }
  .composer .comp-target { font-size: 11.5px; color: var(--muted-2); margin-bottom: 10px; font-family: var(--mono); }
  .tag-choices { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tag-choice {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    padding: 3px 10px; border-radius: 999px; cursor: pointer;

  <script>
  (function () {
    "use strict";

    /* ---------- Load the embedded document ----------
       The markdown is spliced in as base64 (a data block that cannot contain
       "<", so markdown containing script tags can never break this page). */
    var sourceMd;
    try {
      var b64 = document.getElementById("doc-b64").textContent.replace(/\s+/g, "");
      var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
      sourceMd = new TextDecoder("utf-8").decode(bytes);
    } catch (err) {
      fatal("Could not decode the embedded document.", err);
      return;
    }

    function fatal(msg, err, raw) {
      var box = document.createElement("div");
      box.className = "render-error";
      var p = document.createElement("p");
      var strong = document.createElement("strong");
      strong.textContent = "Render failed: ";
      p.appendChild(strong);
      p.appendChild(document.createTextNode(msg + (err ? " (" + err.message + ")" : "")));
      box.appendChild(p);
      if (raw) {
        var pre = document.createElement("pre");
        pre.textContent = raw;
        box.appendChild(pre);
      }
      document.getElementById("main").replaceChildren(box);
    }

    var sourcePath = "";
    try { sourcePath = document.getElementById("source-path").textContent.trim(); } catch (_) {}
    var sourceFileName = sourcePath ? sourcePath.split("/").pop() : "";

    /* Contract: 002-B05 doc-page topbar nav (plan 002-discovery-landing-dns)


       Behavior: pages served over http(s) (location.protocol http: or
         https:) show, at the START of .topbar-actions (before the
         doctype pill), two plain links:
           1. "Index" -> "/"  (the server's global index)
           2. "Worktree" -> "/project/for?path=" +
              encodeURIComponent(sourcePath) - the server 302s to the
              owning worktree's landing page.
         Pages opened over file:// render NEITHER link and behave exactly
         as today.
       Inputs: location.protocol; the embedded sourcePath variable.
       Outputs: two anchor elements styled consistently with existing
         topbar controls, present on every docType, work-graph included.
       Errors: none client-side - the links are plain navigation;
         failures on the target URL surface as the server's own JSON
         errors, never as page breakage; an empty or missing sourcePath
         renders the Index link only.
       Invariants: existing topbar controls (doctype pill, toggles, graph
         button) keep their behavior and relative order; live-update
         re-renders never duplicate the links; no external resources are
         introduced.
       Edge cases: sourcePath with spaces or quotes (URI-encoded);
         scripting disabled (whatever is not rendered simply is not there
         - no errors); narrow viewport (links wrap under the existing
         flex-wrap rules). */
    var servedOverNetwork = window.location.protocol === "http:"
      || window.location.protocol === "https:";
    if (servedOverNetwork) {
      var navIndexEl = document.getElementById("nav-index");
      if (navIndexEl) navIndexEl.hidden = false;
      var navWorktreeEl = document.getElementById("nav-worktree");
      if (navWorktreeEl && sourcePath) {
        navWorktreeEl.href = "/project/for?path=" + encodeURIComponent(sourcePath);
        navWorktreeEl.hidden = false;
      }
    }

    /* Contract: 003-B19 graph node side panel (plan 003-followup-fixes)

       Behavior: on work-graph pages with the graph view active, tapping a
         node opens a side panel (the existing right-hand feedback aside
         is the styling precedent) showing that node's full information -
         id, title, status with any reason, goal, parent, deps, and notes
         - WITHOUT leaving the graph or altering the current view mode. A
         control inside the panel jumps to the node's card: it deactivates
         the graph exactly as the existing toggle does and scrolls to the
         node's section with the existing jump highlight. The panel closes
         on its close control, on tapping empty graph background, and on
         tapping another node (which opens that node instead). Closes
         issue 332.
       Inputs: the captured work-graph model, EXTENDED to retain each
         node's goal and notes text (today the capture keeps only
         id/title/statusKind/statusReason/parent/deps plus the live
         section ref). The model the graph build and the panel consume is
         a GENERIC {nodes, edges, focus} shape whose consumers key on no
         docType-specific field names beyond the node payloads - a second
         document type can plug its own model in without reworking the
         build or the panel (DL-008 Q3 enabler).
       Outputs: panel markup rendered from model data only, HTML-escaped;
         no new external resources.
       Errors: a model node missing goal or notes renders the panel with
         those rows absent - never an exception; any failure while opening
         the panel degrades to today's tap-to-card behavior rather than
         breaking the graph.
       Invariants: the card view stays reachable via the existing toggle;
         the graph-build-failure fallback to the card view is unchanged; a
         live-update re-render closes any open panel cleanly and never
         errors; the feedback aside keeps its own markup, ids, and
         behavior untouched.
       Edge cases: tapping the same node twice (no duplicate panels;
         close-then-reopen is acceptable); a re-render arriving while a
         dropped node's panel is open (the panel simply closes); very long
         notes (the panel scrolls, the page does not). */

    /* Contract: 003-B22 cross-doc auto-linking (plan 003-followup-fixes)

       Behavior: on http(s)-served rendered pages, a prose reference to a
         repo markdown document - a bare or backticked path token ending
         in .md, either absolute or relative (resolved against the source
         document's own directory via the embedded sourcePath) - renders
         as a link to that file's /doc view, so a document that names an
         artifact without an explicit markdown link still navigates (F08).
         Author-written markdown links are held INVARIANT: a reference
         already inside an anchor is never re-wrapped.
       Inputs: the rendered DOM's text and inline-code spans; sourcePath;
         location.protocol.
       Outputs: anchor elements pointing at "/doc" plus the
         percent-encoded resolved target path; file:// pages are
         byte-identical to today (no linkification).
       Errors: NO client-side existence or scope check is attempted (none
         is possible) - a reference to a missing or out-of-scope file
         links anyway and clicks through to the server's normal JSON
         error, an accepted trade-off recorded at planning; any failure
         of the linkify pass leaves the affected span un-linkified and
         the page rendered - linkification never breaks rendering.
       Invariants: text outside path tokens is untouched; existing
         anchors, the TOC, sectionize output, and every schema transform
         behave exactly as today; live-update re-renders re-apply
         linkification idempotently (no nested or duplicated anchors).
       Edge cases: a token containing spaces (not linkified - tokens are
         delimited conservatively); ../ traversal in a relative reference
         (resolved lexically before encoding); a token inside a fenced
         code BLOCK (left alone - only prose and inline code linkify);
         the same path referenced twice (each occurrence links). */

    /* ---------- Doc-type detection hook ---------- */
    var TAGS = ["COMMENT", "QUESTION", "CONCERN", "APPROVE", "EVIDENCE"];
    function detectDocType(md) {
      var m = md.match(/^#\s+(.+)$/m);
      var h1 = m ? m[1].trim() : "";
      if (/^Plan:/i.test(h1)) return "plan";
      if (/^Decision:/i.test(h1)) return "decision";
      if (/^Design Questions:/i.test(h1)) return "design-questions";
      if (/^Work Graph$/i.test(h1)) return "work-graph";
      return "generic";
    }

    var docType = detectDocType(sourceMd);

    /* Contract: B06 graph-view-default (plan 001-render-graph-always)
       Behavior:
         For docType "work-graph" the node-and-edge graph view is the
         DEFAULT on load: state.graphOn initializes true, so the FIRST
         render() paints the graph via its existing state.graphOn branch —
         including that branch's fallback, which deactivates and clears
         the flag when the document has no parseable nodes. Every other
         docType initializes graphOn false, exactly as today. 229-B02's
         docblock prose calling the card layout "the default on load"
         (and its Invariants line about the card layout while "the graph
         is off") is rewritten by this block to describe graph-as-default;
         every other 229-B02 clause stands unchanged.
       Inputs: docType from detectDocType(sourceMd).
       Outputs: first paint of a parseable work-graph doc shows
         #graph-view active and #doc hidden; the toggle button reads
         "Card view" (updateChrome()'s existing active-view labeling,
         unchanged).
       Errors: a throw while building the first graph falls back to the
         card view with graphOn false — activateGraphView()'s existing
         catch posture; the page never breaks.
       Invariants:
         - The toggle still switches graph <-> card freely; card
           rendering itself is byte-for-byte untouched by this block.
         - Non-work-graph docTypes never initialize graph-mode.
       Edge cases: zero parseable nodes (render() forces graphOn false,
         toggle hidden, card/baseline view — same as today); a work-graph
         doc opened via file:// (identical behavior — the default is not
         server-dependent). */
    var state = {
      schemaOn: docType !== "generic",
      feedback: [],
      nextId: 1,
      graphOn: docType === "work-graph"
    };

    /* Work Graph graph-view model (captured fresh on every render(), since
       sectionize() rebuilds .doc-sec elements from scratch each time) and
       the live cytoscape instance, when the graph view is active. */
    var workGraphModel = null;
    var cyInstance = null;

    /* =================================================================
       Render pipeline: markdown -> DOM -> sectionize -> decorate.
       Every schema transform is per-section try/catch: a failure falls
       back to the baseline rendering of that section, never a blank page.
       ================================================================= */

    function render() {
      /* Sections are rebuilt from scratch below, so any open node panel is
         holding references into DOM that is about to be discarded. */
      closeNodePanel();
      var doc = document.getElementById("doc");
      var hero = document.getElementById("hero");
      var html;
      try {
        html = marked.parse(sourceMd, { gfm: true, breaks: false, async: false });
      } catch (err) {
        fatal("The markdown parser threw an error. Raw document below.", err, sourceMd);
        return;
      }
      var scratch = document.createElement("div");
      scratch.innerHTML = html;

      buildHero(hero, scratch);
      sectionize(doc, scratch);
      highlightTags(doc);
      highlightTags(hero);
      workGraphModel = (docType === "work-graph") ? captureWorkGraphModel(doc) : null;
      if (state.schemaOn && docType !== "generic") applySchema(doc);
      try {
        linkifyDocRefs(doc);
        linkifyDocRefs(hero);
      } catch (err) { /* linkification never breaks rendering */ }
      buildToc(doc);
      attachAnnotators(hero, doc);
      if (state.graphOn) {
        if (workGraphModel) {
          activateGraphView();
        } else {
          deactivateGraphView();
          state.graphOn = false;
        }
      }
      updateChrome();
    }

    /* ---------- Hero: H1 + everything before the first H2 ---------- */
    function buildHero(hero, scratch) {
      hero.replaceChildren();
      var h1 = scratch.querySelector("h1");
      var title = h1 ? h1.textContent : "Untitled document";
      document.title = title + " · clam-code";

      var el = document.createElement("h1");
      el.textContent = title;
      hero.appendChild(el);

      // Key: value lines before the first H2 become meta pills in schema
      // view (Ticket:, Date:, Status:, Refs:, Issue:, ...); anything else in
      // the preamble stays as prose.
      var pre = document.createElement("div");
      pre.className = "preamble";
      var node = h1 ? h1.nextSibling : scratch.firstChild;
      while (node) {
        var next = node.nextSibling;
        if (node.nodeType === 1 && node.tagName === "H2") break;
        pre.appendChild(node);
        node = next;
      }

      var pills = document.createElement("div");
      pills.className = "meta-pills";
      if (state.schemaOn && docType !== "generic") {
        try {
          var preText = sourceMd.split(/^##\s/m)[0];
          var re = /^([A-Za-z][A-Za-z -]{0,24}):\s+(.+)$/gm;
          var m2, seen = 0;
          while ((m2 = re.exec(preText)) !== null && seen < 8) {
            var key = m2[1].trim(), val = m2[2].trim();
            var pill = document.createElement("span");
            pill.className = "meta-pill";
            if (/^status$/i.test(key)) {
              pill.classList.add(/^(open|awaiting)/i.test(val) ? "status-open" : "status-resolved");
            }
            var k = document.createElement("span"); k.className = "k"; k.textContent = key;
            var v = document.createElement("span"); v.className = "v"; v.textContent = val;
            pill.appendChild(k); pill.appendChild(v);
            pills.appendChild(pill);
            seen++;
            // Remove the matching "Key: value" line from the preamble prose.
            stripLineFromPreamble(pre, key, val);
          }
        } catch (err) { /* fall back: preamble stays as prose */ }
      }
      if (pills.children.length) hero.appendChild(pills);
      if (pre.textContent.trim()) hero.appendChild(pre);

      var stamp = document.createElement("div");
      stamp.className = "rendered-at";
      stamp.textContent = "rendered " + document.lastModified + " · markdown remains the document of record";
      hero.appendChild(stamp);
    }

    function stripLineFromPreamble(pre, key, val) {
      var walker = document.createTreeWalker(pre, NodeFilter.SHOW_TEXT);
      var target = key + ": " + val;
      var t;
      while ((t = walker.nextNode())) {
        if (t.nodeValue.indexOf(target) !== -1) {
          t.nodeValue = t.nodeValue.replace(target, "").replace(/^\s+|\s+$/g, "");
        }
      }
      // Drop paragraphs and stray <br>s emptied by the stripping.
      Array.prototype.forEach.call(pre.querySelectorAll("p"), function (p) {
        if (!p.textContent.trim()) p.remove();
        else {
          while (p.firstChild && p.firstChild.nodeType === 1 && p.firstChild.tagName === "BR") p.removeChild(p.firstChild);
          while (p.lastChild && p.lastChild.nodeType === 1 && p.lastChild.tagName === "BR") p.removeChild(p.lastChild);
        }
      });
    }

    /* ---------- Sectionize: group each H2 with its content ---------- */
    var slugCounts;
    function slugify(text) {
      var s = text.toLowerCase().replace(/[^\w]+/g, "-").replace(/^-+|-+$/g, "") || "section";
      if (slugCounts[s] !== undefined) { slugCounts[s]++; s = s + "-" + slugCounts[s]; }
      else slugCounts[s] = 0;
      return s;
    }

    function sectionize(doc, scratch) {
      doc.replaceChildren();
      slugCounts = {};
      var sec = null, body = null;
      var node = scratch.firstChild;
      while (node) {
        var next = node.nextSibling;
        if (node.nodeType === 1 && node.tagName === "H2") {
          sec = document.createElement("section");
          sec.className = "doc-sec";
          sec.id = slugify(node.textContent);
          sec.dataset.heading = node.textContent.trim();

          var head = document.createElement("div");
          head.className = "sec-head";
          var caret = document.createElement("span");
          caret.className = "caret";
          caret.textContent = "▼";
          head.appendChild(caret);
          head.appendChild(node);
          sec.appendChild(head);

          body = document.createElement("div");
          body.className = "sec-body";
          sec.appendChild(body);
          doc.appendChild(sec);

          head.addEventListener("click", function (e) {
            if (e.target.closest(".annotate-btn") || e.target.closest(".composer")) return;
            this.parentElement.classList.toggle("collapsed");
          });
        } else if (body) {
          body.appendChild(node);
        } else {
          // Content before any H2 already went to the hero; skip strays.
          node.remove();
        }
        node = next;
      }
      // Give h3s ids for the TOC.
      Array.prototype.forEach.call(doc.querySelectorAll(".sec-body h3"), function (h3) {
        h3.id = slugify(h3.textContent);
      });
    }

    /* ---------- @TAG highlighting (never inside pre/code) ---------- */
    function highlightTags(root) {
      var re = new RegExp("@(" + TAGS.join("|") + "):", "g");
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: function (n) {
          if (!n.nodeValue || n.nodeValue.indexOf("@") === -1) return NodeFilter.FILTER_REJECT;
          if (n.parentElement && n.parentElement.closest("pre, code, script, style")) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      var targets = [];
      var t;
      while ((t = walker.nextNode())) { re.lastIndex = 0; if (re.test(t.nodeValue)) targets.push(t); }
      targets.forEach(function (textNode) {
        var frag = document.createDocumentFragment();
        var text = textNode.nodeValue, last = 0, m;
        re.lastIndex = 0;
        while ((m = re.exec(text)) !== null) {
          frag.appendChild(document.createTextNode(text.slice(last, m.index)));
          var span = document.createElement("span");
          span.className = "tag-mark tag-" + m[1].toLowerCase();
          span.textContent = m[0];
          frag.appendChild(span);
          last = m.index + m[0].length;
        }
        frag.appendChild(document.createTextNode(text.slice(last)));
        textNode.parentNode.replaceChild(frag, textNode);
      });
    }

    /* ---------- Cross-document auto-linking (003-B22) ----------
       A path token is delimited conservatively: no whitespace, ending in
       ".md", bounded by whitespace or common punctuation. Anything looser
       would swallow prose. */
    var MD_REF_RE = /(^|[\s(\[<"'`])(\/?[A-Za-z0-9._@+~-]+(?:\/[A-Za-z0-9._@+~-]+)*\.md)(?=$|[\s)\]>"'`,;:.!?])/g;

    /* Resolve a reference against the source document's own directory and
       collapse "." / ".." segments lexically — the server is never asked
       whether the target exists. */
    function resolveDocRef(token) {
      var base = token.charAt(0) === "/" ? token : sourcePath.replace(/[^/]*$/, "") + token;
      var out = [];
      base.split("/").forEach(function (seg) {
        if (!seg || seg === ".") return;
        if (seg === "..") { out.pop(); return; }
        out.push(seg);
      });
      return "/" + out.join("/");
    }

    function linkifyTextNode(textNode, inCode) {
      var text = textNode.nodeValue;
      var frag = document.createDocumentFragment();
      var last = 0, m, linked = false;
      MD_REF_RE.lastIndex = 0;
      while ((m = MD_REF_RE.exec(text)) !== null) {
        var start = m.index + m[1].length;
        frag.appendChild(document.createTextNode(text.slice(last, start)));
        var a = document.createElement("a");
        a.className = inCode ? "doc-ref code-ref" : "doc-ref";
        a.href = "/doc" + encodeURI(resolveDocRef(m[2]));
        a.textContent = m[2];
        frag.appendChild(a);
        last = start + m[2].length;
        linked = true;
      }
      if (!linked) return;
      frag.appendChild(document.createTextNode(text.slice(last)));
      textNode.parentNode.replaceChild(frag, textNode);
    }

    /* Prose and inline code linkify; author-written anchors and fenced code
       blocks are left exactly as they are. Runs from render(), so every
       live-update repaint re-links a freshly built DOM rather than nesting
       anchors inside the previous pass's output. */
    function linkifyDocRefs(root) {
      if (!servedOverNetwork || !sourcePath) return;
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: function (n) {
          if (!n.nodeValue || n.nodeValue.indexOf(".md") === -1) return NodeFilter.FILTER_REJECT;
          var el = n.parentElement;
          if (!el) return NodeFilter.FILTER_REJECT;
          if (el.closest("a") || el.closest("pre") || el.closest("script, style")) {
            return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      var targets = [];
      var t;
      while ((t = walker.nextNode())) targets.push(t);
      targets.forEach(function (textNode) {
        var el = textNode.parentElement;
        linkifyTextNode(textNode, !!(el && el.matches("code")));
      });
    }

    /* =================================================================
       Schema-aware layer
       ================================================================= */

    function findSection(doc, pattern) {
      var secs = doc.querySelectorAll(".doc-sec");
      for (var i = 0; i < secs.length; i++) {
        if (pattern.test(secs[i].dataset.heading)) return secs[i];
      }
      return null;
    }

    /* Contract: 229-B02 graph-view-mode (plan 001-render-doc-graph-view)
       Behavior:
         An additional "Graph" display mode for docType "work-graph" ONLY:
         a topbar button (id="graph-toggle") beside the schema toggle,
         visible only for work-graph documents, toggles the content area
         between the card layout (reachable via the toggle; the graph
         view is the default on load) and a node-and-edge graph of the
         same document rendered with the
         vendored cytoscape + cytoscape-dagre libraries (layout name
         "dagre", rankDir "TB") into a container that replaces/hides the
         card content while active.
       Inputs:
         The node model from parseWorkGraphNode over the same sections the
         card view uses, captured BEFORE decorateWorkGraphNode mutates the
         section bodies (parse-then-decorate order is load-bearing);
         effectiveParent from breakWorkGraphCycles supplies the parent
         edges (dagre needs the cycle-broken parent graph). Dep edges come
         from each node's Deps list; an id that names no parsed node draws
         no edge and raises no error.
       Outputs (visual language frozen from the approved mock):
         - Node: round-rectangle, label = id + title (wrapped); fill and
           border echo the card pill palette — open gold #f6c177, in
           progress blue #8ab4f8, done
           green #4ade80, dropped coral #ff8a6b with dotted border and a
           " (dropped)" label suffix.
         - Focus node: teal #2dd4bf ring (thicker border + soft underlay);
           Focus: none, or an id with no matching node, means no ring
           anywhere.
         - Edges: parent->child solid gray #6e6a86 with triangle arrows;
           dep->dependent dashed violet #c4a7e7 with vee arrows; a pair
           connected both ways shows both edges distinctly (bezier).
         - Pan (drag) and zoom (wheel) enabled.
         - Tapping a node switches back to the card view and scrolls that
           node's card into view with a transient highlight
           (click-to-card); the toggle button's label reflects the active
           view.
       Errors:
         Any throw while building or laying out the graph is caught: the
         card view stays (or becomes) active and the page never breaks —
         the same degrade posture as the card transform's per-node
         try/catch.
       Invariants:
         - The card layout's rendering and behavior are byte-unchanged
           regardless of which view is active on load; the graph view is
           a first-class alternate presentation of the same document, not
           a modification of the card path.
         - The schema toggle's two-state semantics are untouched; the
           graph button is hidden for every other docType and in generic
           rendering.
         - The graph container matches no BLOCK_SEL entry (canvas content
           is not block-annotatable); section-level annotate is
           unaffected.
         - No new external resources; everything works offline/file://.
         - v1 excludes search/filter, subtree collapse, and
           drag-to-rearrange persistence (deferred by plan 001).
       Edge cases:
         - Zero parseable nodes: button hidden, baseline fallback
           untouched.
         - A single node; multiple roots (several Parent: none nodes).
         - Dep cycles (dagre's internal acyclic handling; must not hang).
         - Dropped nodes stay visible in the graph (never filtered out).
         - The same pair linked by both a parent and a dep edge.
    */
    function renderWorkGraphGraphView() {
      var container = document.getElementById("graph-view");
      container.replaceChildren();

      /* The build consumes the generic {nodes, edges, focus} model only: any
         document type able to produce that shape renders here unchanged. */
      var model = workGraphModel;
      var elements = [];
      model.nodes.forEach(function (node) {
        var label = node.id + " — " + node.title + (node.statusKind === "dropped" ? " (dropped)" : "");
        var classes = "wg-graph-" + node.statusKind + (node.id === model.focus ? " wg-graph-focus" : "");
        elements.push({ data: { id: node.id, label: label }, classes: classes });
      });
      model.edges.forEach(function (edge) {
        elements.push({
          data: { id: edge.id, source: edge.source, target: edge.target },
          classes: "wg-graph-edge-" + edge.kind
        });
      });

      var cy = cytoscape({
        container: container,
        elements: elements,
        layout: { name: "dagre", rankDir: "TB", nodeSep: 36, rankSep: 64 },
        style: [
          {
            selector: "node",
            style: {
              "shape": "round-rectangle",
              "label": "data(label)",
              "text-wrap": "wrap",
              "text-max-width": "170px",
              "width": "label",
              "height": "label",
              "padding": "10px",
              "font-size": "11px",
              "font-family": "ui-sans-serif, system-ui, sans-serif",
              "text-valign": "center",
              "text-halign": "center",
              "color": "#050810",
              "background-color": "#f6c177",
              "border-width": 2,
              "border-color": "#f6c177",
              "border-style": "solid"
            }
          },
          { selector: "node.wg-graph-in-progress", style: { "background-color": "#8ab4f8", "border-color": "#8ab4f8" } },
          { selector: "node.wg-graph-done", style: { "background-color": "#4ade80", "border-color": "#4ade80" } },
          { selector: "node.wg-graph-dropped", style: { "background-color": "#ff8a6b", "border-color": "#ff8a6b", "border-style": "dotted" } },
          { selector: "node.wg-graph-focus", style: { "border-width": 4, "border-color": "#2dd4bf" } },
          {
            selector: "edge.wg-graph-edge-parent",
            style: {
              "width": 2,
              "curve-style": "bezier",
              "line-color": "#6e6a86",
              "target-arrow-color": "#6e6a86",
              "target-arrow-shape": "triangle",
              "line-style": "solid"
            }
          },
          {
            selector: "edge.wg-graph-edge-dep",
            style: {
              "width": 2,
              "curve-style": "bezier",
              "line-color": "#c4a7e7",
              "target-arrow-color": "#c4a7e7",
              "target-arrow-shape": "vee",
              "line-style": "dashed"
            }
          }
        ]
      });

      cy.on("tap", "node", function (evt) {
        var id = evt.target.id();
        try {
          if (openNodePanel(id)) return;
        } catch (err) { /* degrade below */ }
        tapToCard(id);
      });

      cy.on("tap", function (evt) {
        if (evt.target === cy) closeNodePanel();
      });

      return cy;
    }

    /* 229-B02's original click-to-card, kept as the degrade path for a panel
       that would not open (Errors clause, 003-B19). It deliberately shares no
       helper with the panel, since it runs precisely when panel code threw. */
    function tapToCard(id) {
      deactivateGraphView();
      updateChrome();
      var tapped = (workGraphModel && workGraphModel.byId) ? workGraphModel.byId[id] : null;
      if (tapped && tapped.sec) {
        tapped.sec.scrollIntoView({ behavior: "smooth", block: "center" });
        tapped.sec.classList.add("wg-jump-highlight");
        setTimeout(function () { tapped.sec.classList.remove("wg-jump-highlight"); }, 1600);
      }
    }

    /* Contract: 004-B25 hide TOC in graph view (plan 004-graph-view-toc-and-plan-as-graph)

       Behavior: activateGraphView() hides the #toc nav; deactivateGraphView()
         restores it. The Contents pane is never visible while the graph
         view is active; when the card view returns, the TOC is fully
         functional - links, expand/collapse controls, and scroll
         tracking all behave exactly as before the graph was opened.
       Inputs: the #toc element; the existing graph-view lifecycle
         (activateGraphView / deactivateGraphView call sites).
       Outputs: no new markup, no new external resources; visibility is
         toggled on the existing #toc element only, plus a "graph-active"
         class on the .layout grid so the remaining #main column spans the
         full width (without it, auto-placement drops #main into the 250px
         TOC column and the graph renders in a strip at the left edge).
       Errors: a failure while hiding or restoring the TOC never breaks
         rendering (same degrade posture as the rest of the graph
         lifecycle - the page stays usable).
       Invariants: file:// pages and non-work-graph docTypes are
         unaffected (they never activate the graph view); the TOC's
         content, ids, and controls are byte-unchanged - only visibility
         toggles; the feedback drawer and node panel are untouched.
       Edge cases: graph-build failure (activate immediately degrades to
         deactivate) leaves the TOC visible, as the card view is showing;
         a live-update re-render while the graph is active keeps the TOC
         hidden. */

    /* Show the graph container and build/lay out the cytoscape instance;
       any throw while building or laying out the graph degrades back to
       the card view (Errors clause, 229-B02) rather than breaking the page. */
    function activateGraphView() {
      var docEl = document.getElementById("doc");
      var container = document.getElementById("graph-view");
      var tocEl = document.getElementById("toc");
      var layoutEl = document.querySelector(".layout");
      docEl.style.display = "none";
      container.hidden = false;
      if (tocEl) { tocEl.hidden = true; }
      // Widen to one column BEFORE cytoscape reads the container's size.
      if (layoutEl) { layoutEl.classList.add("graph-active"); }
      try {
        if (cyInstance) { cyInstance.destroy(); cyInstance = null; }
        cyInstance = renderWorkGraphGraphView();
        state.graphOn = true;
      } catch (err) {
        deactivateGraphView();
        state.graphOn = false;
      }
    }

    function deactivateGraphView() {
      if (cyInstance) {
        try { cyInstance.destroy(); } catch (err) { /* already gone */ }
        cyInstance = null;
      }
      var tocEl = document.getElementById("toc");
      var layoutEl = document.querySelector(".layout");
      document.getElementById("graph-view").hidden = true;
      document.getElementById("doc").style.display = "";
      if (tocEl) { tocEl.hidden = false; }
      if (layoutEl) { layoutEl.classList.remove("graph-active"); }
      closeNodePanel();
      state.graphOn = false;
    }

    /* ---------- Graph node detail panel (003-B19) ----------
       One panel element, reused: opening a second node repaints it rather
       than stacking, so the same node tapped twice can never duplicate. */
    var panelNodeId = null;

    function closeNodePanel() {
      var panel = document.getElementById("node-panel");
      if (!panel) return;
      panelNodeId = null;
      panel.hidden = true;
      var body = document.getElementById("panel-body");
      if (body) body.replaceChildren();
      document.body.classList.remove("wg-split");
      wgResizeGraph();
    }

    /* The docked panel changes the graph container's width; cytoscape must be
       told, or the canvas keeps its stale size and taps mis-hit. */
    function wgResizeGraph() {
      requestAnimationFrame(function () {
        if (cyInstance) {
          try { cyInstance.resize(); } catch (err) { /* mid-teardown */ }
        }
      });
    }

    /* One label/value row, both set as text — model data never becomes
       markup (Outputs clause). */
    function panelRow(label, value) {
      var row = document.createElement("div");
      row.className = "np-row";
      var k = document.createElement("span");
      k.className = "np-k";
      k.textContent = label;
      var v = document.createElement("span");
      v.className = "np-v";
      v.textContent = value;
      row.appendChild(k);
      row.appendChild(v);
      return row;
    }

    /* One node-reference chip; clicking it repaints the panel for that node,
       so Parent/Deps are navigable without leaving the split view. */
    function panelNodeRef(id) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "np-ref";
      var target = (workGraphModel && workGraphModel.byId) ? workGraphModel.byId[id] : null;
      btn.textContent = target ? id + " — " + target.title : id;
      btn.addEventListener("click", function () {
        try { openNodePanel(id); } catch (err) { /* keep current panel */ }
      });
      return btn;
    }

    /* A row whose value is arbitrary DOM rather than text. */
    function panelRowNode(label, valueEl) {
      var row = document.createElement("div");
      row.className = "np-row";
      var k = document.createElement("span");
      k.className = "np-k";
      k.textContent = label;
      row.appendChild(k);
      valueEl.classList.add("np-v");
      row.appendChild(valueEl);
      return row;
    }

    /* Paint the panel for one model node and enter the split view: graph
       docked left, this panel a full-height right column with the node's
       complete detail. Returns false when the node is not in the model, so
       the caller can fall back to the card view. */
    function openNodePanel(id) {
      var node = (workGraphModel && workGraphModel.byId) ? workGraphModel.byId[id] : null;
      var panel = document.getElementById("node-panel");
      var body = document.getElementById("panel-body");
      if (!node || !panel || !body) return false;
      /* Set before the Notes block: hydrateLinkedDoc snapshots this id as its
         staleness guard, so it must already name the node being painted. */
      panelNodeId = node.id;
      document.getElementById("panel-title").textContent = node.id;
      body.replaceChildren();

      var title = document.createElement("div");
      title.className = "np-title";
      title.textContent = node.title;
      body.appendChild(title);

      var pill = document.createElement("span");
      pill.className = "wg-status-pill wg-status-" + node.statusKind;
      pill.textContent = node.statusKind === "dropped"
        ? "dropped (" + node.statusReason + ")"
        : node.statusKind.replace("-", " ");
      var pillWrap = document.createElement("span");
      pillWrap.appendChild(pill);
      body.appendChild(panelRowNode("Status", pillWrap));

      if (node.goal) body.appendChild(panelRow("Goal", node.goal));

      if (node.parent) {
        var pv = document.createElement("span");
        pv.appendChild(panelNodeRef(node.parent));
        body.appendChild(panelRowNode("Parent", pv));
      } else {
        body.appendChild(panelRow("Parent", "none"));
      }

      if (node.deps && node.deps.length) {
        var dv = document.createElement("span");
        node.deps.forEach(function (dep) { dv.appendChild(panelNodeRef(dep)); });
        body.appendChild(panelRowNode("Deps", dv));
      } else {
        body.appendChild(panelRow("Deps", "none"));
      }

      if (node.notesHtml) {
        var nv = document.createElement("span");
        nv.className = "np-notes";
        nv.innerHTML = node.notesHtml; /* sanitized in wgFieldHtml */
        body.appendChild(panelRowNode("Notes", nv));
        hydrateLinkedDoc(body, nv);
      } else if (node.notes) {
        body.appendChild(panelRow("Notes", node.notes));
      }

      panel.hidden = false;
      panel.scrollTop = 0;
      document.body.classList.add("wg-split");
      wgResizeGraph();
      return true;
    }

    /* ---------- Linked-artifact hydration ----------
       When a node's Notes link to a served markdown file (possibly with a
       #section fragment), fetch that file over the server's /raw route and
       render the referenced section inline below the rows, so the panel
       carries the linked detail, not just the link. Served pages only;
       any failure is a silent skip — the panel is complete without it. */
    function wgGhSlug(text) {
      return text.toLowerCase()
        .replace(/[^\p{L}\p{N}_ -]/gu, "")
        .replace(/ /g, "-");
    }

    /* The fragment's section of a markdown string: from the heading whose
       GitHub-style slug matches, up to the next heading of the same or a
       shallower level. No fragment => the whole document. Null when the
       fragment matches no heading. */
    function wgExtractSection(md, frag) {
      if (!frag) return md;
      var lines = md.split("\n");
      var out = null;
      var lvl = 0;
      for (var i = 0; i < lines.length; i++) {
        var m = /^(#{1,6})[ \t]+(.+?)[ \t]*#*[ \t]*$/.exec(lines[i]);
        if (m) {
          if (out !== null && m[1].length <= lvl) break;
          if (out === null && wgGhSlug(m[2]) === frag.toLowerCase()) {
            out = [lines[i]];
            lvl = m[1].length;
            continue;
          }
        }
        if (out !== null) out.push(lines[i]);
      }
      return out ? out.join("\n") : null;
    }

    function hydrateLinkedDoc(body, notesEl) {
      if (location.protocol !== "http:" && location.protocol !== "https:") return;
      var link = null;
      var anchors = notesEl.querySelectorAll("a[href]");
      for (var i = 0; i < anchors.length; i++) {
        var p = anchors[i].pathname || "";
        if (p.indexOf("/doc/") === 0 && /\.md$/i.test(p)) { link = anchors[i]; break; }
      }
      if (!link) return;
      var mdPath = link.pathname.slice("/doc".length);
      var frag = (link.hash || "").replace(/^#/, "");
      var forNode = panelNodeId;
      fetch("/raw" + mdPath)
        .then(function (res) { return res.ok ? res.text() : null; })
        .then(function (md) {
          if (md === null || panelNodeId !== forNode || !body.isConnected) return;
          var section = wgExtractSection(md, frag);
          if (section === null || !section.replace(/\s/g, "").length) return;
          var block = document.createElement("div");
          block.className = "np-doc";
          var src = document.createElement("div");
          src.className = "np-doc-src";
          src.textContent = "From " + decodeURIComponent(mdPath).split("/").pop() + " ";
          var open = document.createElement("a");
          open.href = link.href;
          open.textContent = "open ↗";
          src.appendChild(open);
          block.appendChild(src);
          var content = document.createElement("div");
          try {
            content.innerHTML = marked.parse(section);
          } catch (err) {
            content.textContent = section;
          }
          block.appendChild(content);
          body.appendChild(block);
        })
        .catch(function () { /* silent skip */ });
    }

    /* Contract: B01 workgraph-transform (plan 001-render-doc-workgraph-transform)
       Behavior:
         Schema-aware rendering for Work Graph documents, format per
         docs/protocols/work-graph.md (the transform keys on that protocol
         only; it never references any plugin).
         1. detectDocType returns "work-graph" when the document's first H1
            text is exactly "Work Graph" (case-insensitive, trimmed) — an
            exact-match arm, unlike the existing `Label:` prefix arms.
         2. applySchema runs [transformWorkGraph] for docType "work-graph"
            via an explicit branch; a work-graph document must never fall
            into the else-branch (which runs the Plan transforms).
         3. transformWorkGraph(doc):
            - Focus marker: matched anywhere in the source markdown with
              the protocol's regex /^Focus: (N[0-9]+|none)[ \t]*$/m.
            - Node sections: every .doc-sec whose dataset.heading matches
              /^N[0-9]+ — /. Fields parsed from the section's bullet list:
              Goal (required), Status (open | in progress | done | dropped (reason),
              required), Parent (none | N<NN>, required), Deps (none |
              comma-separated N<NN> list, required), Notes (optional).
            - Tree layout: node cards nested inside their Parent's card
              (children container, indented); Parent: none => top level.
            - Dep badges: one "needs: N<NN>" badge per Deps entry.
            - Status pills: four-way — open, in progress, done, dropped; a dropped
              pill preserves the reason text on the card.
            - Focus banner: when Focus names an existing node, a banner at
              the top of the document names it (id + title) and the
              focused card is visually marked. Focus: none, or an id with
              no matching node: no banner, no error.
       Outputs:
         Rendered DOM only; the source markdown, the annotation write-back
         path, and render.sh are untouched by this block.
       Errors:
         None thrown to the page: a node section missing a required field
         or with a malformed Status falls back to baseline rendering for
         that node only (per-node try/catch, transformDesignQuestions
         precedent); a document with zero parseable node sections renders
         entirely as baseline.
       Invariants:
         - All logic lives client-side in this file; no new <script>
           elements (script-count invariant), no external resources.
         - Plan/Decision/Design-Questions transforms and behavior are
           unchanged.
         - Every synthesized block container class joins BLOCK_SEL (the
           .tl-entry precedent) so nodes stay block-annotatable; every
           synthesized badge/pill/banner/label class joins SYNTH_SEL so
           annotation excerpts stay verbatim-greppable in the source.
         - The no-schema tooltip in updateChrome names Work Graph
           alongside the three existing types.
       Edge cases:
         - Focus: none; Focus naming a missing node id (banner suppressed).
         - dropped (reason) where the reason itself contains parentheses.
         - Deps: none vs multi-entry Deps lists.
         - Multi-line Goal values.
         - A child node appearing before its Parent in document order.
         - A Parent cycle (must not loop: nodes on a detected cycle render
           un-nested at top level).
    */
    function transformWorkGraph(doc) {
      var FOCUS_RE = /^Focus: (N[0-9]+|none)[ \t]*$/m;
      var nodesById = {};
      var order = [];

      Array.prototype.forEach.call(doc.querySelectorAll(".doc-sec"), function (sec) {
        var heading = sec.dataset.heading || "";
        if (!WG_HEADING_RE.test(heading)) return; // not a node section; leave untouched
        try {
          var node = parseWorkGraphNode(sec, heading);
          decorateWorkGraphNode(node);
          nodesById[node.id] = node;
          order.push(node.id);
        } catch (err) { /* this node falls back to baseline rendering */ }
      });

      if (!order.length) return; // zero parseable node sections -> baseline untouched

      var effectiveParent = breakWorkGraphCycles(order, nodesById);
      var childrenOf = {};
      order.forEach(function (id) {
        var p = effectiveParent[id];
        var key = (p && nodesById[p]) ? p : "";
        if (!childrenOf[key]) childrenOf[key] = [];
        childrenOf[key].push(id);
      });

      var anchor = nodesById[order[0]].sec;
      var tree = document.createElement("div");
      tree.className = "wg-tree";
      anchor.parentNode.insertBefore(tree, anchor);
      (childrenOf[""] || []).forEach(function (id) {
        tree.appendChild(buildWorkGraphNodeTree(id, childrenOf, nodesById));
      });

      var fm = FOCUS_RE.exec(sourceMd);
      var focusId = fm ? fm[1] : null;
      if (focusId && focusId !== "none" && nodesById[focusId]) {
        var banner = document.createElement("div");
        banner.className = "wg-focus-banner";
        banner.textContent = "→ Focus: " + focusId + " — " + nodesById[focusId].title;
        doc.insertBefore(banner, doc.firstChild);
        nodesById[focusId].sec.classList.add("wg-focused");
      }
    }

    /* ---------- Work Graph parsing/rendering helpers ----------
       Format is normative per docs/protocols/work-graph.md; this transform
       keys on that protocol only and never references any plugin. ---------- */
    var WG_HEADING_RE = /^(N[0-9]+) — (.+)$/;

    function wgFieldLabel(li) {
      var first = li.firstChild;
      while (first && first.nodeType === 3 && !first.nodeValue.trim()) first = first.nextSibling;
      if (!first || first.nodeType !== 3) return null;
      var m = first.nodeValue.match(/^\s*(Goal|Status|Parent|Deps|Notes)\s*:\s*/i);
      return m ? m[1].toLowerCase() : null;
    }

    function wgFieldText(li) {
      var text = li.textContent.replace(/\s+/g, " ").trim();
      return text.replace(/^(Goal|Status|Parent|Deps|Notes)\s*:\s*/i, "").trim();
    }

    /* Preserve child nodes (e.g. a highlighted @TAG span) while dropping only
       the leading "Label: " text, so prose fields keep their inline markup. */
    function wgFieldContentNodes(li) {
      var out = [];
      var strippedFirst = false;
      Array.prototype.forEach.call(li.childNodes, function (n) {
        if (!strippedFirst && n.nodeType === 3) {
          strippedFirst = true;
          var v = n.nodeValue.replace(/^\s*(Goal|Status|Parent|Deps|Notes)\s*:\s*/i, "");
          if (v) out.push(document.createTextNode(v));
          return;
        }
        strippedFirst = true;
        out.push(n.cloneNode(true));
      });
      return out;
    }

    function findWorkGraphFieldList(body) {
      var uls = body.querySelectorAll(":scope > ul");
      for (var i = 0; i < uls.length; i++) {
        var firstLi = uls[i].querySelector(":scope > li");
        if (firstLi && wgFieldLabel(firstLi) === "goal") return uls[i];
      }
      return null;
    }

    /* Parse one node section's Goal/Status/Parent/Deps(/Notes) bullet list.
       Throws on any missing-required-field or malformed-Status/Parent/Deps
       condition; the caller's per-node try/catch falls that section back to
       baseline rendering rather than letting the whole document blank out. */
    function parseWorkGraphNode(sec, heading) {
      var m = WG_HEADING_RE.exec(heading);
      var body = sec.querySelector(".sec-body");
      var ul = findWorkGraphFieldList(body);
      if (!ul) throw new Error("work-graph: no field list");

      var fields = {};
      Array.prototype.forEach.call(ul.querySelectorAll(":scope > li"), function (li) {
        var label = wgFieldLabel(li);
        if (label) fields[label] = li;
      });
      if (!fields.goal || !fields.status || !fields.parent || !fields.deps) {
        throw new Error("work-graph: missing a required field");
      }

      var statusText = wgFieldText(fields.status);
      var statusKind, statusReason = "";
      if (/^open$/i.test(statusText)) {
        statusKind = "open";
      } else if (/^in progress$/i.test(statusText)) {
        statusKind = "in-progress";
      } else if (/^done$/i.test(statusText)) {
        statusKind = "done";
      } else {
        var dm = /^dropped\s*\((.+)\)\s*$/i.exec(statusText);
        if (!dm || !dm[1].trim()) throw new Error("work-graph: malformed Status");
        statusKind = "dropped";
        statusReason = dm[1].trim();
      }

      var parentText = wgFieldText(fields.parent);
      if (!/^(none|N[0-9]+)$/i.test(parentText)) throw new Error("work-graph: malformed Parent");

      var depsText = wgFieldText(fields.deps);
      var deps = [];
      if (!/^none$/i.test(depsText)) {
        deps = depsText.split(",").map(function (s) { return s.trim(); });
        if (!deps.length || deps.some(function (d) { return !/^N[0-9]+$/i.test(d); })) {
          throw new Error("work-graph: malformed Deps");
        }
      }

      return {
        id: m[1],
        title: m[2].trim(),
        sec: sec,
        ul: ul,
        goalNodes: wgFieldContentNodes(fields.goal),
        notesNodes: fields.notes ? wgFieldContentNodes(fields.notes) : null,
        statusKind: statusKind,
        statusReason: statusReason,
        parent: /^none$/i.test(parentText) ? null : parentText,
        deps: deps
      };
    }

    /* Replace the raw field bullet list with a status pill, one dep badge per
       Deps entry, and Goal/Notes prose — all inside one .wg-summary block so
       the whole thing stays one quotable unit (the .tl-entry precedent). */
    function decorateWorkGraphNode(node) {
      var pill = document.createElement("span");
      pill.className = "wg-status-pill wg-status-" + node.statusKind;
      pill.textContent = node.statusKind === "dropped" ? "dropped (" + node.statusReason + ")" : node.statusKind.replace("-", " ");

      var meta = document.createElement("div");
      meta.className = "wg-meta";
      meta.appendChild(pill);
      node.deps.forEach(function (dep) {
        var badge = document.createElement("span");
        badge.className = "wg-dep-badge";
        badge.textContent = "needs: " + dep;
        meta.appendChild(badge);
      });

      var summary = document.createElement("div");
      summary.className = "wg-summary";
      summary.appendChild(meta);

      var goal = document.createElement("p");
      goal.className = "wg-goal";
      node.goalNodes.forEach(function (n) { goal.appendChild(n); });
      summary.appendChild(goal);

      if (node.notesNodes && node.notesNodes.length) {
        var notes = document.createElement("p");
        notes.className = "wg-notes";
        node.notesNodes.forEach(function (n) { notes.appendChild(n); });
        summary.appendChild(notes);
      }

      node.ul.replaceWith(summary);
    }

    /* Walk each node's Parent chain; a chain that revisits a node it already
       passed through is a cycle, so every node on that cycle is detached to
       the top level (effective parent null) instead of looping forever. */
    function breakWorkGraphCycles(order, nodesById) {
      var effectiveParent = {};
      order.forEach(function (id) { effectiveParent[id] = nodesById[id].parent; });
      var color = {}; // 1 = on the current walk, 2 = fully resolved
      order.forEach(function (start) {
        if (color[start]) return;
        var path = [];
        var cur = start;
        while (cur && nodesById[cur] && color[cur] !== 2) {
          if (color[cur] === 1) {
            var idx = path.indexOf(cur);
            for (var i = idx; i < path.length; i++) effectiveParent[path[i]] = null;
            break;
          }
          color[cur] = 1;
          path.push(cur);
          var p = effectiveParent[cur];
          cur = (p && nodesById[p]) ? p : null;
        }
        path.forEach(function (id) { if (color[id] !== 2) color[id] = 2; });
      });
      return effectiveParent;
    }

    /* Graph-view model capture (229-B02): parses every work-graph node
       section from a DETACHED CLONE of each .doc-sec — never the live
       section transformWorkGraph will decorate for the card view — so this
       always succeeds regardless of schemaOn state and never interferes
       with the card transform's own parse-then-decorate pass. Each clone is
       parsed then decorated (mirroring the card pipeline's own order, load-
       bearing per node: parseWorkGraphNode needs the raw field list, which
       decorateWorkGraphNode replaces) purely to validate the node round-
       trips cleanly; only the plain fields plus the REAL (live) .doc-sec
       reference (for click-to-card scrolling) are kept. Returns null when
       docType isn't work-graph or zero sections parse. */
    var WG_FOCUS_RE = /^Focus: (N[0-9]+|none)[ \t]*$/m;

    /* The prose of one parsed field, flattened to plain text for the panel. */
    function wgFieldPlainText(nodes) {
      if (!nodes || !nodes.length) return "";
      return nodes.map(function (n) { return n.textContent || ""; })
        .join("").replace(/\s+/g, " ").replace(/^\s+|\s+$/g, "");
    }

    /* The same field kept as sanitized HTML, so the split-view panel can show
       the node's links live. Only a small whitelist survives: anchors (href
       re-checked to http/https/relative — no javascript: etc.), code, em,
       strong; everything else is flattened to its text. */
    function wgFieldHtml(nodes) {
      if (!nodes || !nodes.length) return "";
      var holder = document.createElement("div");
      nodes.forEach(function (n) { holder.appendChild(n.cloneNode(true)); });
      var out = document.createElement("div");
      (function sanitize(src, dst) {
        Array.prototype.forEach.call(src.childNodes, function (child) {
          if (child.nodeType === Node.TEXT_NODE) {
            dst.appendChild(document.createTextNode(child.textContent));
            return;
          }
          if (child.nodeType !== Node.ELEMENT_NODE) return;
          var tag = child.tagName.toLowerCase();
          if (tag === "a") {
            var href = child.getAttribute("href") || "";
            if (/^\s*(javascript|data|vbscript):/i.test(href)) {
              dst.appendChild(document.createTextNode(child.textContent));
              return;
            }
            var a = document.createElement("a");
            a.setAttribute("href", href);
            sanitize(child, a);
            dst.appendChild(a);
            return;
          }
          if (tag === "code" || tag === "em" || tag === "strong") {
            var el = document.createElement(tag);
            sanitize(child, el);
            dst.appendChild(el);
            return;
          }
          sanitize(child, dst); /* unknown element: keep its content, drop the tag */
        });
      })(holder, out);
      return out.innerHTML;
    }

    function captureWorkGraphModel(doc) {
      var byId = {};
      var nodes = [];
      var order = [];
      Array.prototype.forEach.call(doc.querySelectorAll(".doc-sec"), function (sec) {
        var heading = sec.dataset.heading || "";
        if (!WG_HEADING_RE.test(heading)) return;
        try {
          var clone = sec.cloneNode(true);
          var parsed = parseWorkGraphNode(clone, heading);
          var goalText = wgFieldPlainText(parsed.goalNodes);
          var notesText = wgFieldPlainText(parsed.notesNodes);
          var notesHtml = wgFieldHtml(parsed.notesNodes);
          decorateWorkGraphNode(parsed);
          var node = {
            id: parsed.id,
            title: parsed.title,
            statusKind: parsed.statusKind,
            statusReason: parsed.statusReason,
            goal: goalText,
            notes: notesText,
            notesHtml: notesHtml,
            parent: parsed.parent,
            deps: parsed.deps,
            sec: sec
          };
          byId[parsed.id] = node;
          nodes.push(node);
          order.push(parsed.id);
        } catch (err) { /* excluded from the graph, same fallback posture as the card transform */ }
      });
      if (!order.length) return null;

      /* Edges belong to the MODEL, not to the graph build: parent edges come
         from the cycle-broken parent chain, dep edges from each node's Deps.
         A second document type supplies its own edges the same way. */
      var effectiveParent = breakWorkGraphCycles(order, byId);
      var edges = [];
      order.forEach(function (id) {
        var p = effectiveParent[id];
        if (p && byId[p]) {
          edges.push({ id: "wg-parent-" + p + "-" + id, source: p, target: id, kind: "parent" });
        }
      });
      order.forEach(function (id) {
        byId[id].deps.forEach(function (dep) {
          if (byId[dep]) {
            edges.push({ id: "wg-dep-" + dep + "-" + id, source: dep, target: id, kind: "dep" });
          }
        });
      });

      var fm = WG_FOCUS_RE.exec(sourceMd);
      var focusId = fm ? fm[1] : null;
      return {
        nodes: nodes,
        edges: edges,
        focus: (focusId && focusId !== "none" && byId[focusId]) ? focusId : null,
        byId: byId
      };
    }

    /* Recursively wrap a node's (already decorated) .doc-sec together with a
       .wg-children container holding its own children, nested inside the
       node's own .sec-body — literal "card nested inside parent's card". */
    function buildWorkGraphNodeTree(id, childrenOf, nodesById) {
      var node = nodesById[id];
      var wrap = document.createElement("div");
      wrap.className = "wg-node";
      wrap.appendChild(node.sec);
      var kids = childrenOf[id];
      if (kids && kids.length) {
        var kidsWrap = document.createElement("div");
        kidsWrap.className = "wg-children";
        kids.forEach(function (kid) {
          kidsWrap.appendChild(buildWorkGraphNodeTree(kid, childrenOf, nodesById));
        });
        node.sec.querySelector(".sec-body").appendChild(kidsWrap);
      }
      return wrap;
    }

    function applySchema(doc) {
      var transforms;
      if (docType === "decision") transforms = [transformOptionCards, transformRecommendation];
      else if (docType === "design-questions") transforms = [transformDesignQuestions];
      else if (docType === "work-graph") transforms = [transformWorkGraph];
      else transforms = [transformApproachCards, transformEdgeCases, transformChangelog];
      transforms.forEach(function (fn) {
        try { fn(doc); } catch (err) { /* per-section fallback to baseline */ }
      });
    }

    /* Split a section body at each H3 into {title, nodes} groups. */
    function splitByH3(body) {
