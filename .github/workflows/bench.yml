name: bench
on:
  push:
    branches: [bench/sweep-2]
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: CPU topology
        run: |
          echo "FACT	nproc	$(nproc)"
          echo "FACT	physical_cores	$(grep -c '^core id' /proc/cpuinfo | head -1)"
          echo "FACT	distinct_core_ids	$(awk -F: '/^core id/{print $2}' /proc/cpuinfo | sort -u | wc -l)"
          echo "FACT	distinct_physical_ids	$(awk -F: '/^physical id/{print $2}' /proc/cpuinfo | sort -u | wc -l)"
          echo "FACT	siblings	$(awk -F: '/^siblings/{print $2; exit}' /proc/cpuinfo | tr -d ' ')"
          echo "FACT	cpu_cores	$(awk -F: '/^cpu cores/{print $2; exit}' /proc/cpuinfo | tr -d ' ')"
          echo "FACT	model	$(awk -F: '/^model name/{print $2; exit}' /proc/cpuinfo | sed 's/^ *//')"
          lscpu | grep -iE 'thread|core|socket|model name' | sed 's/^/LSCPU\t/'
