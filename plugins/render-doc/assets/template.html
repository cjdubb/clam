      var groups = [], current = null;
      Array.prototype.slice.call(body.childNodes).forEach(function (node) {
        if (node.nodeType === 1 && node.tagName === "H3") {
          current = { title: node.textContent.trim(), heading: node, nodes: [] };
          groups.push(current);
        } else if (current) {
          current.nodes.push(node);
        }
      });
      return groups;
    }

    /* Which option title does the recommendation text name? "" if none.
       Matches an "Option N" reference or the option's name substring, so both
       decision docs ("Comparison-card fixture, because…") and design-questions
       docs ("Option 2 (…), because…") resolve to the same highlighted card. */
    function recommendedTitle(groups, recText) {
      if (!recText) return "";
      var text = recText.toLowerCase();
      var found = "";
      groups.forEach(function (g) {
        var numMatch = g.title.match(/^(?:option\s+)?(\d+)[.):]/i);
        if (numMatch && new RegExp("\\boption\\s+" + numMatch[1] + "\\b", "i").test(text)) {
          found = g.title;
          return;
        }
        var name = g.title.replace(/^(?:option\s+)?\d+[.):]\s*/i, "").trim();
        if (name && text.indexOf(name.toLowerCase()) !== -1) found = g.title;
      });
      return found;
    }

    /* Build one comparison card from an {title, heading, nodes} option group.
       Shared by the decision and design-questions transforms. Options titled
       "1. Name", "1) Name", or "Option 1: Name" all get a number badge; the
       "**Pros:** … **Cons:** …" paragraph is split into labelled lists. */
    function buildOptionCard(g, recommended) {
      var card = document.createElement("div");
      card.className = "opt-card";
      if (recommended && g.title === recommended) {
        card.classList.add("recommended");
        var flag = document.createElement("span");
        flag.className = "rec-flag";
        flag.textContent = "Recommended";
        card.appendChild(flag);
      }
      var h3 = document.createElement("h3");
      h3.id = g.heading.id;
      h3.setAttribute("data-toc", g.title);
      var numMatch = g.title.match(/^(?:option\s+)?(\d+)[.):]\s*(.*)$/i);
      if (numMatch) {
        var num = document.createElement("span");
        num.className = "opt-num";
        num.textContent = numMatch[1];
        h3.appendChild(num);
        h3.appendChild(document.createTextNode(numMatch[2]));
      } else {
        h3.textContent = g.title;
      }
      card.appendChild(h3);

      // "**Pros:** ..." and "**Cons:** ..." usually share one paragraph
      // (adjacent lines in the template); split at each label.
      var prosCons = document.createElement("div");
      prosCons.className = "pros-cons";
      function isLabelStrong(node) {
        return node.nodeType === 1 && node.tagName === "STRONG"
          && /^(pros|cons):?$/i.test(node.textContent.trim());
      }
      g.nodes.forEach(function (node) {
        if (!(node.nodeType === 1 && node.tagName === "P" && Array.prototype.some.call(node.childNodes, isLabelStrong))) {
          card.appendChild(node);
          return;
        }
        var current = null;
        var lead = document.createElement("p");
        Array.prototype.slice.call(node.childNodes).forEach(function (child) {
          if (isLabelStrong(child)) {
            current = document.createElement("p");
            var isPros = /^pros/i.test(child.textContent.trim());
            var lbl = document.createElement("span");
            lbl.className = isPros ? "pros-lbl" : "cons-lbl";
            lbl.textContent = child.textContent.trim().replace(/:$/, "");
            current.appendChild(lbl);
            prosCons.appendChild(current);
            child.remove();
          } else if (current) {
            current.appendChild(child);
          } else {
            lead.appendChild(child);
          }
        });
        if (lead.textContent.trim()) card.appendChild(lead);
      });
      if (prosCons.children.length) card.appendChild(prosCons);
      return card;
    }

    /* Decision: Options as side-by-side comparison cards. */
    function transformOptionCards(doc) {
      var sec = findSection(doc, /^Options\b/i);
      if (!sec) return;
      var body = sec.querySelector(".sec-body");
      var groups = splitByH3(body);
      if (!groups.length) return;

      var recSec = findSection(doc, /^Recommendation\b/i);
      var recText = recSec ? recSec.querySelector(".sec-body").textContent.trim() : "";
      var recommended = recommendedTitle(groups, recText);

      var grid = document.createElement("div");
      grid.className = "card-grid";
      groups.forEach(function (g) { grid.appendChild(buildOptionCard(g, recommended)); });
      body.replaceChildren(grid);
    }

    /* Decision: Recommendation as a banner. */
    function transformRecommendation(doc) {
      var sec = findSection(doc, /^Recommendation\b/i);
      if (sec) sec.classList.add("rec-banner");
    }

    /* =================================================================
       Design-questions schema
       Each "## DQ<n>:" section carries its own options and recommendation
       (unlike a decision doc, where Options and Recommendation are separate
       top-level sections). Every DQ is transformed independently, so a
       non-conforming question (prose options, no Recommendation) falls back
       to baseline rendering for that section only — never a blank page.
       ================================================================= */
    function transformDesignQuestions(doc) {
      Array.prototype.forEach.call(doc.querySelectorAll(".doc-sec"), function (sec) {
        if (!/^DQ\s*\d/i.test(sec.dataset.heading || "")) return; // "DQ<n>:" sections only; skip Dimension Assessment etc.
        try { transformOneDq(sec); } catch (err) { /* this DQ falls back to baseline */ }
      });
    }

    function transformOneDq(sec) {
      var body = sec.querySelector(".sec-body");
      var parts = splitDqSection(body);
      if (!parts.options.length) return; // no enumerated options -> leave generic

      var recNode = null;
      parts.trailing.forEach(function (node) {
        if (!recNode && isLabelPara(node, /^recommendation\b/i)) recNode = node;
      });
      var recText = recNode ? recNode.textContent.replace(/^\s*recommendation:?\s*/i, "").trim() : "";
      var recommended = recommendedTitle(parts.options, recText);

      var grid = document.createElement("div");
      grid.className = "card-grid";
      parts.options.forEach(function (g) { grid.appendChild(buildOptionCard(g, recommended)); });

      var frag = document.createDocumentFragment();
      parts.intro.forEach(function (n) { frag.appendChild(n); });
      frag.appendChild(grid);
      parts.trailing.forEach(function (node) {
        frag.appendChild(node === recNode ? buildRecBanner(node) : node);
      });
      body.replaceChildren(frag);
    }

    /* Split a DQ body into {intro, options[], trailing}. Options are H3 groups;
       the first "**Tradeoff assessment:**" or "**Recommendation:**" paragraph
       ends the options region so trailing prose is not swept into the last
       card (splitByH3 would otherwise absorb everything after the last H3). */
    function splitDqSection(body) {
      var intro = [], options = [], trailing = [], current = null, phase = "intro";
      Array.prototype.slice.call(body.childNodes).forEach(function (node) {
        if (phase !== "trailing" && node.nodeType === 1 && node.tagName === "H3") {
          current = { title: node.textContent.trim(), heading: node, nodes: [] };
          options.push(current);
          phase = "options";
          return;
        }
        if (phase === "options" && isLabelPara(node, /^(tradeoff assessment|recommendation)\b/i)) {
          phase = "trailing";
        }
        if (phase === "trailing") trailing.push(node);
        else if (phase === "options") current.nodes.push(node);
        else intro.push(node);
      });
      return { intro: intro, options: options, trailing: trailing };
    }

    /* A <p> whose leading strong label matches `re` (e.g. /^recommendation\b/). */
    function isLabelPara(node, re) {
      if (!(node && node.nodeType === 1 && node.tagName === "P")) return false;
      var first = node.firstChild;
      while (first && first.nodeType === 3 && !first.nodeValue.trim()) first = first.nextSibling;
      return !!first && first.nodeType === 1 && first.tagName === "STRONG" && re.test(first.textContent.trim());
    }

    /* Turn a "**Recommendation:** ..." paragraph into a highlighted banner. */
    function buildRecBanner(p) {
      var banner = document.createElement("p");
      banner.className = "dq-rec";
      var lbl = document.createElement("span");
      lbl.className = "dq-rec-lbl";
      lbl.textContent = "Recommendation";
      banner.appendChild(lbl);
      var dropped = false;
      Array.prototype.slice.call(p.childNodes).forEach(function (child) {
        if (!dropped && child.nodeType === 1 && child.tagName === "STRONG"
            && /^recommendation:?$/i.test(child.textContent.trim())) {
          dropped = true;
          return;
        }
        banner.appendChild(child);
      });
      // Trim a leading ": " orphaned by removing the label strong.
      var afterLbl = banner.childNodes[1];
      if (afterLbl && afterLbl.nodeType === 3) {
        afterLbl.nodeValue = afterLbl.nodeValue.replace(/^\s*:?\s*/, " ");
      }
      return banner;
    }

    /* Plan: Approaches Also Considered as cards with ✕ why-not lines. */
    function transformApproachCards(doc) {
      var sec = findSection(doc, /^Approaches (Also )?Considered\b/i);
      if (!sec) return;
      var body = sec.querySelector(".sec-body");
      var groups = splitByH3(body);
      if (!groups.length) return;

      var intro = document.createDocumentFragment();
      var first = body.firstChild;
      while (first && !(first.nodeType === 1 && first.tagName === "H3")) {
        var nxt = first.nextSibling;
        intro.appendChild(first);
        first = nxt;
      }

      var grid = document.createElement("div");
      grid.className = "card-grid";
      groups.forEach(function (g) {
        var card = document.createElement("div");
        card.className = "opt-card";
        var h3 = document.createElement("h3");
        h3.id = g.heading.id;
        h3.textContent = g.title;
        card.appendChild(h3);
        g.nodes.forEach(function (node) {
          if (node.nodeType === 1 && node.tagName === "UL") {
            Array.prototype.forEach.call(node.querySelectorAll(":scope > li"), function (li) {
              var strong = li.querySelector(":scope > strong:first-child");
              var label = strong ? strong.textContent.replace(/[:\s]+$/, "") : "";
              var p = document.createElement("p");
              if (/^why not$/i.test(label)) { p.className = "why-not"; strong.remove(); }
              else if (/^description$/i.test(label)) { p.className = "desc-line"; strong.remove(); }
              while (li.firstChild) p.appendChild(li.firstChild);
              if (p.firstChild && p.firstChild.nodeType === 3) {
                p.firstChild.nodeValue = p.firstChild.nodeValue.replace(/^:\s*/, "");
              }
              card.appendChild(p);
            });
          } else {
            card.appendChild(node);
          }
        });
        grid.appendChild(card);
      });
      body.replaceChildren(intro, grid);
    }

    /* Plan: Edge Cases list — scenario → behavior, CRITICAL flagged. */
    function transformEdgeCases(doc) {
      var sec = findSection(doc, /^Edge Cases\b/i);
      if (!sec) return;
      var body = sec.querySelector(".sec-body");
      Array.prototype.forEach.call(body.querySelectorAll(":scope > ul"), function (ul) {
        ul.classList.add("edge-list");
        Array.prototype.forEach.call(ul.querySelectorAll(":scope > li"), function (li) {
          if (/^\s*CRITICAL\b/.test(li.textContent)) {
            li.classList.add("critical");
            var w = document.createTreeWalker(li, NodeFilter.SHOW_TEXT);
            var t;
            while ((t = w.nextNode())) {
              var idx = t.nodeValue.indexOf("CRITICAL");
              if (idx !== -1) {
                var after = t.splitText(idx);
                after.nodeValue = after.nodeValue.replace(/^CRITICAL:?\s*/, "");
                var badge = document.createElement("span");
                badge.className = "crit-badge";
                badge.textContent = "critical";
                after.parentNode.insertBefore(badge, after);
                break;
              }
            }
          }
          // Emphasize the scenario → behavior arrow.
          var walker = document.createTreeWalker(li, NodeFilter.SHOW_TEXT, {
            acceptNode: function (n) {
              return n.parentElement && n.parentElement.closest("pre, code")
                ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
            }
          });
          var tn, found = [];
          while ((tn = walker.nextNode())) if (/→|->/.test(tn.nodeValue)) found.push(tn);
          found.forEach(function (node) {
            var parts = node.nodeValue.split(/→|->/);
            if (parts.length < 2) return;
            var frag = document.createDocumentFragment();
            parts.forEach(function (part, i) {
              if (i > 0) {
                var arrow = document.createElement("span");
                arrow.className = "edge-arrow";
                arrow.textContent = " → ";
                frag.appendChild(arrow);
              }
              frag.appendChild(document.createTextNode(part));
            });
            node.parentNode.replaceChild(frag, node);
          });
        });
      });
    }

    /* Plan: Changelog table as a timeline. */
    function transformChangelog(doc) {
      var sec = findSection(doc, /^Changelog\b/i);
      if (!sec) return;
      var body = sec.querySelector(".sec-body");
      var table = body.querySelector("table");
      if (!table) return;
      var headers = Array.prototype.map.call(table.querySelectorAll("thead th"), function (th) {
        return th.textContent.trim().toLowerCase();
      });
      var di = headers.indexOf("date"), ci = headers.indexOf("change"), ri = headers.indexOf("reason");
      if (di === -1 || ci === -1) return;
      var timeline = document.createElement("div");
      timeline.className = "timeline";
      Array.prototype.forEach.call(table.querySelectorAll("tbody tr"), function (tr) {
        var cells = tr.querySelectorAll("td");
        var entry = document.createElement("div");
        entry.className = "tl-entry";
        var date = document.createElement("div");
        date.className = "tl-date";
        date.textContent = cells[di] ? cells[di].textContent.trim() : "";
        var change = document.createElement("div");
        change.className = "tl-change";
        change.textContent = cells[ci] ? cells[ci].textContent.trim() : "";
        entry.appendChild(date);
        entry.appendChild(change);
        if (ri !== -1 && cells[ri] && cells[ri].textContent.trim() && cells[ri].textContent.trim() !== "-") {
          var reason = document.createElement("div");
          reason.className = "tl-reason";
          reason.textContent = cells[ri].textContent.trim();
          entry.appendChild(reason);
        }
        timeline.appendChild(entry);
      });
      table.replaceWith(timeline);
    }

    /* =================================================================
       Table of contents
       ================================================================= */

    var observer = null;
    function buildToc(doc) {
      var list = document.getElementById("toc-list");
      list.replaceChildren();
      if (observer) observer.disconnect();

      Array.prototype.forEach.call(doc.querySelectorAll(".doc-sec"), function (sec) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = "#" + sec.id;
        a.textContent = sec.dataset.heading;
        a.dataset.target = sec.id;
        li.appendChild(a);
        list.appendChild(li);
        Array.prototype.forEach.call(sec.querySelectorAll(".sec-body h3"), function (h3) {
          if (!h3.id) return;
          var li3 = document.createElement("li");
          li3.className = "lvl-3";
          var a3 = document.createElement("a");
          a3.href = "#" + h3.id;
          a3.textContent = h3.getAttribute("data-toc") || h3.textContent;
          li3.appendChild(a3);
          list.appendChild(li3);
        });
      });

      observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          var link = list.querySelector('a[data-target="' + entry.target.id + '"]');
          if (link && entry.isIntersecting) {
            list.querySelectorAll("a.active").forEach(function (x) { x.classList.remove("active"); });
            link.classList.add("active");
          }
        });
      }, { rootMargin: "-80px 0px -70% 0px" });
      doc.querySelectorAll(".doc-sec").forEach(function (sec) { observer.observe(sec); });
    }

    // Expand a collapsed section when its TOC entry is clicked.
    document.getElementById("toc-list").addEventListener("click", function (e) {
      var a = e.target.closest("a");
      if (!a) return;
      var target = document.getElementById(a.getAttribute("href").slice(1));
      if (!target) return;
      var sec = target.classList.contains("doc-sec") ? target : target.closest(".doc-sec");
      if (sec) sec.classList.remove("collapsed");
    });

    document.getElementById("expand-all").addEventListener("click", function () {
      document.querySelectorAll(".doc-sec.collapsed").forEach(function (s) { s.classList.remove("collapsed"); });
    });
    document.getElementById("collapse-all").addEventListener("click", function () {
      document.querySelectorAll(".doc-sec").forEach(function (s) { s.classList.add("collapsed"); });
    });

    /* =================================================================
       Feedback composer — emits the exact clam annotation vocabulary:
       @COMMENT: @QUESTION: @CONCERN: @APPROVE: @EVIDENCE:
       ================================================================= */

    function attachAnnotators(hero, doc) {
      var h1 = hero.querySelector("h1");
      var heroBtn = makeAnnotateBtn(h1 ? h1.textContent : "(document)");
      hero.appendChild(heroBtn);
      Array.prototype.forEach.call(doc.querySelectorAll(".doc-sec"), function (sec) {
        var btn = makeAnnotateBtn(sec.dataset.heading);
        sec.querySelector(".sec-head").appendChild(btn);
      });
    }

    function makeAnnotateBtn(anchor) {
      var btn = document.createElement("button");
      btn.className = "annotate-btn";
      btn.textContent = "+ annotate";
      btn.title = "Add feedback on “" + anchor + "”";
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        openComposer(btn, anchor);
      });
      return btn;
    }

    var openComposerEl = null;
    var annotatingBlock = null;
    function openComposer(btn, anchor, block) {
      closeComposer();
      var excerpt = block ? excerptFor(block) : "";
      var comp = document.createElement("div");
      comp.className = "composer";
      var target = document.createElement("div");
      target.className = "comp-target";
      target.textContent = "§ " + anchor + (excerpt ? " ¶ “" + excerpt + "”" : "");
      comp.appendChild(target);

      var choices = document.createElement("div");
      choices.className = "tag-choices";
      var selected = "COMMENT";
      TAGS.forEach(function (tag, i) {
        var c = document.createElement("button");
        c.className = "tag-choice tag-" + tag.toLowerCase() + (i === 0 ? " sel" : "");
        c.textContent = "@" + tag;
        c.addEventListener("click", function () {
          selected = tag;
          choices.querySelectorAll(".sel").forEach(function (x) { x.classList.remove("sel"); });
          c.classList.add("sel");
        });
        choices.appendChild(c);
      });
      comp.appendChild(choices);

      var ta = document.createElement("textarea");
      ta.placeholder = "Your note… (@APPROVE can be empty)";
      comp.appendChild(ta);

      var actions = document.createElement("div");
      actions.className = "comp-actions";
      var cancel = document.createElement("button");
      cancel.className = "btn";
      cancel.textContent = "Cancel";
      cancel.addEventListener("click", closeComposer);
      var add = document.createElement("button");
      add.className = "btn active";
      add.textContent = "Add";
      add.addEventListener("click", function () {
        var note = ta.value.trim();
        if (!note && selected !== "APPROVE") { ta.focus(); return; }
        var item = { id: state.nextId++, section: anchor, excerpt: excerpt, tag: selected, note: note };
        state.feedback.push(item);
        renderFeedback();
        document.getElementById("drawer").classList.add("show");
        closeComposer();
        saveAnnotationToFile(item).then(function (saved) {
          if (saved) showSaveStatus("Saved to " + (sourceFileName || "file"), true);
          else if (SAVE_ENABLED) showSaveStatus("Save failed — use Copy all feedback", false);
        });
      });
      actions.appendChild(cancel);
      actions.appendChild(add);
      comp.appendChild(actions);

      if (block) {
        comp.classList.add("floating");
        document.body.appendChild(comp);
        var r = block.getBoundingClientRect();
        comp.style.top = (window.scrollY + r.bottom + 8) + "px";
        var left = window.scrollX + r.left;
        var maxLeft = window.scrollX + document.documentElement.clientWidth - comp.offsetWidth - 20;
        comp.style.left = Math.max(12, Math.min(left, maxLeft)) + "px";
        block.classList.add("annotating");
        annotatingBlock = block;
      } else {
        var sec = btn.closest(".doc-sec");
        if (sec) sec.querySelector(".sec-head").after(comp);
        else document.getElementById("hero").appendChild(comp);
      }
      openComposerEl = comp;
      ta.focus();
    }

    function closeComposer() {
      if (openComposerEl) { openComposerEl.remove(); openComposerEl = null; }
      if (annotatingBlock) { annotatingBlock.classList.remove("annotating"); annotatingBlock = null; }
      if (liveUpdatePending) {
        liveUpdatePending = false;
        applyLiveUpdate();
      }
    }

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeComposer();
    });

    /* ---------- Block-level annotation (paragraphs, bullets, rows) ----------
       A single gutter “+” follows the hovered block. Excerpts quote only text
       that exists in the source markdown: elements synthesized by the schema
       transforms (badges, option numbers, arrows, labels) are skipped, so the
       copied anchor is always greppable in the source document. */
    var BLOCK_SEL = "p, li, blockquote, tr, .tl-entry, .wg-summary";
    var SYNTH_SEL = ".rec-flag, .opt-num, .crit-badge, .edge-arrow, .pros-lbl, .cons-lbl, .dq-rec-lbl, .block-annotate, .composer, .wg-status-pill, .wg-dep-badge, .wg-focus-banner";

    function annotatableBlock(el) {
      if (!el || el.nodeType !== 1) return null;
      if (el.closest(".composer, .copy-overlay")) return null;
      var block = el.closest(BLOCK_SEL);
      if (!block) return null;
      if (!block.closest("#doc .sec-body") && !block.closest("#hero .preamble")) return null;
      if (block.closest("pre, code")) return null;
      if (block.tagName === "TR" && !block.closest("tbody")) return null;
      return block;
    }

    function excerptFor(block) {
      var out = "";
      (function walk(node) {
        for (var n = node.firstChild; n; n = n.nextSibling) {
          if (n.nodeType === 3) { out += n.nodeValue; continue; }
          if (n.nodeType !== 1) continue;
          if (n.matches(SYNTH_SEL)) { out += " "; continue; } // never quote synthesized text
          if (block.tagName === "LI" && (n.tagName === "UL" || n.tagName === "OL")) continue; // this bullet only, not its children
          walk(n);
          if (/^(TD|TH|DIV|P|LI|BR)$/.test(n.tagName)) out += " ";
        }
      })(block);
      out = out.replace(/\s+/g, " ").trim();
      if (out.length > 80) {
        var cut = out.slice(0, 80);
        var sp = cut.lastIndexOf(" ");
        if (sp > 40) cut = cut.slice(0, sp);
        out = cut + "…";
      }
      return out;
    }

    var blockBtn = document.createElement("button");
    blockBtn.type = "button";
    blockBtn.className = "block-annotate";
    blockBtn.textContent = "+";
    blockBtn.title = "Annotate this block";
    document.body.appendChild(blockBtn);

    var hoverBlock = null, hideTimer = null;
    document.addEventListener("mouseover", function (e) {
      if (e.target === blockBtn) { clearTimeout(hideTimer); return; }
      var block = annotatableBlock(e.target);
      clearTimeout(hideTimer);
      if (block) {
        hoverBlock = block;
        var r = block.getBoundingClientRect();
        blockBtn.style.top = (window.scrollY + r.top) + "px";
        blockBtn.style.left = (window.scrollX + r.left - 28) + "px";
        blockBtn.classList.add("show");
      } else {
        hideTimer = setTimeout(function () {
          blockBtn.classList.remove("show");
          hoverBlock = null;
        }, 300);
      }
    });

    blockBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (!hoverBlock || !hoverBlock.isConnected) return;
      var sec = hoverBlock.closest(".doc-sec");
      var h1 = document.querySelector("#hero h1");
      var anchor = sec ? sec.dataset.heading : (h1 ? h1.textContent : "(document)");
      openComposer(blockBtn, anchor, hoverBlock);
    });

    function renderFeedback() {
      var list = document.getElementById("drawer-list");
      list.replaceChildren();
      if (!state.feedback.length) {
        var empty = document.createElement("div");
        empty.className = "drawer-empty";
        empty.textContent = "No feedback yet. Hover a section heading (“+ annotate”) or any paragraph, bullet, or row (“+”).";
        list.appendChild(empty);
      }
      state.feedback.forEach(function (item) {
        var el = document.createElement("div");
        el.className = "fb-item";
        var sec = document.createElement("div");
        sec.className = "fb-sec";
        sec.textContent = "§ " + item.section;
        var note = document.createElement("div");
        note.className = "fb-note";
        var tag = document.createElement("span");
        tag.className = "tag-mark tag-" + item.tag.toLowerCase();
        tag.textContent = "@" + item.tag + ":";
        note.appendChild(tag);
        note.appendChild(document.createTextNode(" " + item.note));
        var del = document.createElement("button");
        del.className = "fb-del";
        del.textContent = "✕";
        del.title = "Remove";
        del.addEventListener("click", function () {
          state.feedback = state.feedback.filter(function (x) { return x.id !== item.id; });
          renderFeedback();
        });
        el.appendChild(sec);
        if (item.excerpt) {
          var ex = document.createElement("div");
          ex.className = "fb-excerpt";
          ex.textContent = "¶ “" + item.excerpt + "”";
          el.appendChild(ex);
        }
        el.appendChild(note);
        el.appendChild(del);
        list.appendChild(el);
      });
      var btn = document.getElementById("feedback-btn");
      btn.textContent = "Feedback · " + state.feedback.length;
      btn.classList.toggle("attention", state.feedback.length > 0);
    }

    function feedbackBlock() {
      return state.feedback.map(function (item) {
        var where = "§ " + item.section + (item.excerpt ? ' ¶ "' + item.excerpt + '"' : "");
        return where + " — @" + item.tag + ":" + (item.note ? " " + item.note : "");
      }).join("\n");
    }

    document.getElementById("copy-all").addEventListener("click", function () {
      var text = feedbackBlock();
      if (!text) return;
      var self = this;
      function done() {
        self.textContent = "Copied ✓";
        setTimeout(function () { self.textContent = "Copy all feedback"; }, 1600);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { manualCopy(text); });
      } else {
        manualCopy(text);
      }
    });

    /* Clipboard API unavailable (or denied): show the block pre-selected
       so one ⌘C finishes the job. */
    function manualCopy(text) {
      var overlay = document.createElement("div");
      overlay.className = "copy-overlay";
      var box = document.createElement("div");
      box.className = "box";
      var hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = "Clipboard access was blocked — the text below is selected; press ⌘C, then Close.";
      var ta = document.createElement("textarea");
      ta.value = text;
      var actions = document.createElement("div");
      actions.className = "comp-actions";
      var close = document.createElement("button");
      close.className = "btn";
      close.textContent = "Close";
      close.addEventListener("click", function () { overlay.remove(); });
      actions.appendChild(close);
      box.appendChild(hint);
      box.appendChild(ta);
      box.appendChild(actions);
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      ta.focus();
      ta.select();
    }

    /* =================================================================
       Save annotation to markdown source via local annotation server.
       When served from localhost (render.sh --open starts serve.py),
       each Add POSTs the annotation; the server writes to the .md file.
       On file:// (no server), Add still works in-memory and "Copy all
       feedback" remains available.
       ================================================================= */
    var SAVE_ENABLED = window.location.protocol === "http:";

    function saveAnnotationToFile(item) {
      if (!SAVE_ENABLED) return Promise.resolve(false);
      return fetch("/annotate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          md: sourcePath,
          section: item.section,
          excerpt: item.excerpt,
          tag: item.tag,
          note: item.note
        })
      }).then(function (res) {
        return res.ok;
      })["catch"](function () {
        return false;
      });
    }

    /* Contract: B05 live-update-client (plan 001-render-graph-always)
       Behavior:
         When the page is served by the shared render-doc server (same
         detection as SAVE_ENABLED: window.location.protocol === "http:"),
         poll the server for source changes and re-render in place:
         1. Every POLL_MS (1500) send
            GET /raw/<percent-encoded sourcePath>, carrying
            If-None-Match: <last seen ETag> once an ETag is known.
         2. A 304 changes nothing.
         3. A 200 remembers the new ETag, replaces sourceMd with the
            response text, then applies the update:
            a. If a composer is open (openComposerEl non-null), HOLD the
               update — a draft is never destroyed: polling continues,
               newer content replaces the held content, and the newest
               held update is applied the moment the composer closes.
            b. Otherwise: record view state — the set of collapsed
               .doc-sec ids and the window scroll position — call
               render(), re-apply the collapsed ids that still exist,
               and restore the scroll position. state.feedback, the
               drawer, and docType are untouched (docType is NOT
               re-detected; an H1 changing type mid-session is out of
               scope). An active graph view rebuilds through render()'s
               existing graphOn branch; a fresh dagre layout is
               acceptable.
         4. Poll failures (rejected fetch, or any status other than 200
            and 304) never break the page: after 5 consecutive failures
            the poll interval backs off to POLL_MS * 4, returning to
            POLL_MS after the next success.
         5. On file:// the poller never starts: zero network requests.
       Inputs: sourcePath (embedded at splice time); the server's /raw
         route; openComposerEl for the composer guard.
       Outputs: the page reflects the file's current content within about
         two poll intervals of a change, with no user action.
       Errors: polling errors are silent to the user (no toast; console
         at most) — the annotation save-status UI is not reused for them.
       Invariants:
         - Never re-renders while a composer is open.
         - Exactly one poller per page lifetime; re-renders must not
           stack additional timers.
         - Polls nothing but /raw/<sourcePath> on the page's own origin;
           no new external resources.
         - The annotation flow is unchanged: a server-written @TAG: line
           arrives as a normal content change on a later poll, and the
           in-memory feedback drawer keeps working exactly as today.
       Edge cases: empty document (renders empty, polling continues);
         a 200 with no ETag header (treat every 200 as changed — correct,
         merely chattier); server restarted mid-session (failures back
         off, recovery is automatic on success); background-tab interval
         throttling (acceptable — updates apply when the tab wakes);
         sourcePath empty (poller never starts — nothing to poll). */
    var POLL_MS = 1500;
    var liveEtag = null;
    var liveMisses = 0;
    var liveUpdatePending = false;

    function nextPollDelay() {
      return liveMisses >= 5 ? POLL_MS * 4 : POLL_MS;
    }

    function scheduleLivePoll(delay) {
      setTimeout(pollLiveUpdate, delay);
    }

    /* Capture the collapsed .doc-sec ids and the scroll position, call
       render(), then restore both — the composer, drawer, docType and
       state.feedback are never touched here. */
    function applyLiveUpdate() {
      var collapsedIds = [];
      document.querySelectorAll(".doc-sec.collapsed").forEach(function (sec) {
        collapsedIds.push(sec.id);
      });
      var scrollPos = window.scrollY || window.pageYOffset || 0;
      render();
      collapsedIds.forEach(function (id) {
        var sec = document.getElementById(id);
        if (sec) sec.classList.add("collapsed");
      });
      window.scrollTo(0, scrollPos);
    }

    function pollLiveUpdate() {
      var headers = {};
      if (liveEtag) headers["If-None-Match"] = liveEtag;
      fetch("/raw/" + encodeURI(sourcePath), { headers: headers }).then(function (res) {
        if (res.status === 304) {
          liveMisses = 0;
          scheduleLivePoll(nextPollDelay());
          return;
        }
        if (!res.ok) {
          liveMisses++;
          scheduleLivePoll(nextPollDelay());
          return;
        }
        var newEtag = res.headers.get("ETag") || res.headers.get("etag");
        return res.text().then(function (text) {
          liveMisses = 0;
          liveEtag = newEtag;
          sourceMd = text;
          if (openComposerEl) {
            liveUpdatePending = true;
          } else {
            applyLiveUpdate();
          }
          scheduleLivePoll(nextPollDelay());
        });
      })["catch"](function () {
        liveMisses++;
        scheduleLivePoll(nextPollDelay());
      });
    }

    function startLiveUpdate() {
      if (!SAVE_ENABLED) return;
      if (!sourcePath) return;
      scheduleLivePoll(POLL_MS);
    }

    function showSaveStatus(msg, ok) {
      var btn = document.getElementById("feedback-btn");
      btn.textContent = msg;
      btn.classList.toggle("active", ok);
      btn.classList.toggle("error", !ok);
      btn.classList.remove("attention");
      setTimeout(function () {
        btn.textContent = "Feedback · " + state.feedback.length;
        btn.classList.toggle("attention", state.feedback.length > 0);
        btn.classList.remove("active");
        btn.classList.remove("error");
      }, 2000);
    }

    document.getElementById("clear-all").addEventListener("click", function () {
      state.feedback = [];
      renderFeedback();
    });
    document.getElementById("feedback-btn").addEventListener("click", function () {
      document.getElementById("drawer").classList.toggle("show");
    });
    document.getElementById("panel-close").addEventListener("click", function () {
      closeNodePanel();
    });

    /* The panel's jump control: leave the graph exactly as the toggle does,
       then land on the node's own card with the existing jump highlight. */
    document.getElementById("panel-jump").addEventListener("click", function () {
      var target = (panelNodeId && workGraphModel && workGraphModel.byId)
        ? workGraphModel.byId[panelNodeId] : null;
      deactivateGraphView();
      updateChrome();
      if (target && target.sec) {
        target.sec.scrollIntoView({ behavior: "smooth", block: "center" });
        target.sec.classList.add("wg-jump-highlight");
        setTimeout(function () { target.sec.classList.remove("wg-jump-highlight"); }, 1600);
      }
    });

    document.getElementById("drawer-close").addEventListener("click", function () {
      document.getElementById("drawer").classList.remove("show");
    });

    /* ---------- Chrome: doc-type pill + schema toggle ---------- */
    function updateChrome() {
      var pill = document.getElementById("doctype-pill");
      var toggle = document.getElementById("schema-toggle");
      if (docType === "generic") {
        pill.textContent = "document";
        pill.classList.add("generic");
        toggle.disabled = true;
        toggle.textContent = "Schema view";
        toggle.title = "No schema detected — the H1 does not start with Plan:, Decision:, or Design Questions:, and is not exactly \"Work Graph\"";
      } else {
        pill.textContent = docType;
        pill.classList.remove("generic");
        toggle.disabled = false;
        toggle.textContent = state.schemaOn ? "Schema view ✓" : "Generic view ✓";
        toggle.classList.toggle("active", state.schemaOn);
      }

      /* graph-toggle: visible only for work-graph docs with at least one
         parseable node (229-B02). */
      var graphToggle = document.getElementById("graph-toggle");
      var graphAvailable = docType === "work-graph" && !!workGraphModel;
      graphToggle.hidden = !graphAvailable;
      if (graphAvailable) {
        graphToggle.textContent = state.graphOn ? "Card view" : "Graph";
        graphToggle.classList.toggle("active", state.graphOn);
      }
    }

    document.getElementById("schema-toggle").addEventListener("click", function () {
      if (docType === "generic") return;
      state.schemaOn = !state.schemaOn;
      closeComposer();
      render();
    });

    document.getElementById("graph-toggle").addEventListener("click", function () {
      if (!workGraphModel) return;
      if (state.graphOn) {
        deactivateGraphView();
        state.graphOn = false;
      } else {
        activateGraphView();
      }
      updateChrome();
    });

    /* ---------- Boot ---------- */
    if (typeof marked === "undefined" || !marked || typeof marked.parse !== "function") {
      fatal("The vendored markdown parser is missing from this file. Re-run render.sh; raw document below.", null, sourceMd);
      return;
    }
    render();
    renderFeedback();
    startLiveUpdate();
  })();
  </script>

</body>
