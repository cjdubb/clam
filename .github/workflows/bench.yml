name: bench

# Throwaway: does shellcheck chunk cleanly across cores? Runs only on its own
# branch. Note the `|| true` on every invocation: shellcheck exits nonzero
# whenever it reports a finding, and GitHub runs `run:` steps under `bash -e`,
# so without it the step dies before printing a timing.
on:
  push:
    branches: [bench/sweep-2]

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: shellcheck chunking
        run: |
          mapfile -t FILES < <(git ls-files -z | tr '\0' '\n' | grep -E '\.sh$' | sort)
          echo "FACT	nproc	$(nproc)"
          echo "FACT	shfiles	${#FILES[@]}"
          for rep in 1 2; do
            s=$(date +%s.%N)
            shellcheck -f gcc --exclude=SC2317 -- "${FILES[@]}" >/dev/null 2>&1 || true
            e=$(date +%s.%N)
            printf 'CHUNK\t1\t%s\n' "$(echo "$e - $s" | bc)"
            for J in 2 4 8; do
              n=$(( (${#FILES[@]} + J - 1) / J ))
              s=$(date +%s.%N)
              printf '%s\n' "${FILES[@]}" \
                | xargs -P "$J" -n "$n" shellcheck -f gcc --exclude=SC2317 -- >/dev/null 2>&1 || true
              e=$(date +%s.%N)
              printf 'CHUNK\t%s\t%s\n' "$J" "$(echo "$e - $s" | bc)"
            done
          done

      # Chunking must not change what the gate reports. Same finding set,
      # sorted, from one invocation and from four.
      - name: chunked output is identical to single-invocation output
        run: |
          mapfile -t FILES < <(git ls-files -z | tr '\0' '\n' | grep -E '\.sh$' | sort)
          shellcheck -f gcc --exclude=SC2317 -- "${FILES[@]}" 2>/dev/null | sort > /tmp/one.txt || true
          n=$(( (${#FILES[@]} + 3) / 4 ))
          printf '%s\n' "${FILES[@]}" \
            | xargs -P 4 -n "$n" shellcheck -f gcc --exclude=SC2317 -- 2>/dev/null | sort > /tmp/four.txt || true
          echo "FACT	findings_one	$(wc -l < /tmp/one.txt)"
          echo "FACT	findings_four	$(wc -l < /tmp/four.txt)"
          if diff -q /tmp/one.txt /tmp/four.txt >/dev/null; then
            echo "IDENTICAL	yes"
          else
            echo "IDENTICAL	no"
            diff /tmp/one.txt /tmp/four.txt | head -20
          fi
